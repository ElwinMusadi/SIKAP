<script>
// ============================================================
// JS_Pengaturan.html — Settings Page Controller
// ============================================================

SIKAP.Settings = SIKAP.Settings || {};

/**
 * Loads the user profile data into the Settings form.
 * Called when the settings view is shown.
 */
SIKAP.Settings.loadProfile = function() {
  SIKAP.Api.call('getUserProfile', { token: SIKAP.state.token })
    .then(function(result) {
      if (result && result.success) {
        var d = result.data;
        document.getElementById('settings-nama').value = d.nama || '—';
        document.getElementById('settings-nip').value = d.nip || '—';
        document.getElementById('settings-role').value = d.role || '—';
        document.getElementById('settings-status').value = d.statusKepegawaian || '—';
        // Tampilkan seksi Backup jika user adalah Admin
        SIKAP.Settings._checkAdminSections(d.role);
      } else {
        var msg = (result && result.message) ? result.message : 'Gagal memuat profil.';
        SIKAP.Toast.show(msg, 'error');
        if (result && result.message && result.message.indexOf('Sesi') !== -1) {
          SIKAP.Auth.handleSessionExpired();
        }
      }
    })
    .catch(function(error) {
      SIKAP.Toast.show('Gagal memuat profil.', 'error');
    });
};

/**
 * Validates the password change form in real-time.
 */
SIKAP.Settings.validatePasswordForm = function() {
  var newPw = document.getElementById('settings-new-pw').value;
  var confirmPw = document.getElementById('settings-confirm-pw').value;
  var submitBtn = document.getElementById('settings-save-pw-btn');
  var matchMsg = document.getElementById('settings-match-msg');

  var reqLength = document.getElementById('settings-req-length');
  var reqCase = document.getElementById('settings-req-case');
  var reqNumber = document.getElementById('settings-req-number');

  var hasLength = newPw.length >= 8;
  var hasCase = /[a-z]/.test(newPw) && /[A-Z]/.test(newPw);
  var hasNumber = /\d/.test(newPw);
  var isMatch = newPw === confirmPw && newPw !== '';

  SIKAP.Auth.updateReqStyle(reqLength, hasLength);
  SIKAP.Auth.updateReqStyle(reqCase, hasCase);
  SIKAP.Auth.updateReqStyle(reqNumber, hasNumber);

  if (confirmPw !== '') {
    if (!isMatch) {
      matchMsg.textContent = 'Password tidak cocok.';
      matchMsg.classList.remove('opacity-0');
    } else {
      matchMsg.textContent = '';
      matchMsg.classList.add('opacity-0');
    }
  } else {
    matchMsg.classList.add('opacity-0');
  }

  var isValid = hasLength && hasCase && hasNumber && isMatch;
  submitBtn.disabled = !isValid;
};

/**
 * Handles the voluntary password change form submission.
 */
SIKAP.Settings.handleChangePassword = function(event) {
  event.preventDefault();

  var currentPw = document.getElementById('settings-current-pw').value;
  var newPw = document.getElementById('settings-new-pw').value;
  var confirmPw = document.getElementById('settings-confirm-pw').value;
  var submitBtn = document.getElementById('settings-save-pw-btn');
  var textEl = document.getElementById('settings-save-pw-text');

  if (!currentPw) {
    SIKAP.Toast.show('Masukkan password saat ini.', 'warning');
    return;
  }
  if (newPw !== confirmPw) {
    SIKAP.Toast.show('Password baru tidak cocok.', 'error');
    return;
  }

  // Loading state
  submitBtn.disabled = true;
  textEl.innerHTML = '<svg class="animate-spin h-5 w-5 text-on-primary inline-block" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path></svg> Menyimpan...';

  SIKAP.Api.call('changePassword', { token: SIKAP.state.token, newPassword: newPw, currentPassword: currentPw })
    .then(function(result) {
      if (result && result.success) {
        SIKAP.Toast.show('Password berhasil diubah!', 'success');
        // Clear form
        document.getElementById('settings-current-pw').value = '';
        document.getElementById('settings-new-pw').value = '';
        document.getElementById('settings-confirm-pw').value = '';
        // Reset requirement indicators
        SIKAP.Settings.validatePasswordForm();
      } else {
        var msg = (result && result.message) ? result.message : 'Gagal mengubah password.';
        SIKAP.Toast.show(msg, 'error');
        if (result && result.message && result.message.indexOf('Sesi') !== -1) {
          SIKAP.Auth.handleSessionExpired();
        }
      }
      submitBtn.disabled = false;
      textEl.textContent = 'Simpan Password';
    })
    .catch(function(error) {
      SIKAP.Toast.show('Gagal menyimpan password. Coba lagi.', 'error');
      submitBtn.disabled = false;
      textEl.textContent = 'Simpan Password';
    });
};

// ---- Logout Confirmation Modal (delegated to global SIKAP.Auth) ----
SIKAP.Settings.openLogoutModal = function() {
  SIKAP.Auth.openLogoutModal();
};

SIKAP.Settings.closeLogoutModal = function() {
  SIKAP.Auth.closeLogoutModal();
};

SIKAP.Settings.confirmLogout = function() {
  SIKAP.Auth.confirmLogout();
};

/**
 * Menampilkan seksi Admin-only (Backup, WhatsApp) dan memuat status Fonnte.
 */
SIKAP.Settings._checkAdminSections = function(role) {
  var backupSection = document.getElementById('settings-backup-section');
  var waSection = document.getElementById('settings-whatsapp-section');
  if (role === 'Admin') {
    if (backupSection) backupSection.classList.remove('hidden');
    if (waSection) {
      waSection.classList.remove('hidden');
      SIKAP.Settings.loadFonnteStatus();
    }
  }
};

// Keep the old name for backward compatibility
SIKAP.Settings._checkBackupVisibility = SIKAP.Settings._checkAdminSections;

/**
 * Triggers a backup operation.
 * @param {'database'|'full'} type - Type of backup to perform.
 */
SIKAP.Settings.triggerBackup = function(type) {
  var isDb = (type === 'database');
  var btnId = isDb ? 'settings-backup-db-btn' : 'settings-backup-full-btn';
  var textId = isDb ? 'settings-backup-db-text' : 'settings-backup-full-text';
  var apiFunc = isDb ? 'adminBackupDatabase' : 'adminBackupFull';

  var btn = document.getElementById(btnId);
  var textEl = document.getElementById(textId);

  // Loading state
  if (btn) btn.disabled = true;
  if (textEl) textEl.innerHTML =
    '<svg class="animate-spin h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24">' +
    '<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>' +
    '<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>' +
    '</svg>' + (isDb ? 'Membuat backup...' : 'Membuat backup penuh...');

  SIKAP.Api.call(apiFunc, { token: SIKAP.state.token })
    .then(function(result) {
      if (result && result.success) {
        var msg = result.message;
        if (result.data && result.data.url) {
          msg += ' <a href="' + result.data.url + '" target="_blank" class="underline font-medium">Lihat di Drive</a>';
        }
        SIKAP.Toast.show(result.message + (result.data && result.data.docsCopied ? ' (' + result.data.docsCopied + ' file dokumen)' : ''), 'success', 6000);
      } else {
        SIKAP.Toast.show((result && result.message) ? result.message : 'Backup gagal.', 'error');
      }
    })
    .catch(function() {
      SIKAP.Toast.show('Backup gagal. Periksa koneksi dan coba lagi.', 'error');
    })
    .finally(function() {
      if (btn) btn.disabled = false;
      if (textEl) textEl.textContent = isDb ? 'Backup Database Sekarang' : 'Backup Penuh Sekarang';
    });
};

// ============================================================
// WhatsApp / Fonnte Settings
// ============================================================

/**
 * Loads Fonnte configuration status and updates the status indicator.
 */
SIKAP.Settings.loadFonnteStatus = function() {
  SIKAP.Api.call('adminGetFonnteStatus', { token: SIKAP.state.token })
    .then(function(result) {
      var dot = document.getElementById('wa-status-dot');
      var label = document.getElementById('wa-status-label');
      if (!dot || !label) return;

      if (result && result.success) {
        if (result.data.isConfigured) {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 flex-shrink-0';
          label.textContent = 'Token terkonfigurasi (' + result.data.tokenHint + '). Notifikasi WhatsApp aktif.';
        } else {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 flex-shrink-0';
          label.textContent = 'Token belum dikonfigurasi. Notifikasi WhatsApp tidak aktif.';
        }
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-error flex-shrink-0';
        label.textContent = 'Gagal memeriksa status.';
      }
    })
    .catch(function() {
      var label = document.getElementById('wa-status-label');
      if (label) label.textContent = 'Gagal memeriksa status.';
    });
};

/**
 * Toggles visibility of the token input field.
 */
SIKAP.Settings.toggleWaTokenVisibility = function() {
  var input = document.getElementById('wa-token-input');
  var icon = document.getElementById('wa-token-vis-icon');
  if (!input) return;
  if (input.type === 'password') {
    input.type = 'text';
    if (icon) icon.textContent = 'visibility_off';
  } else {
    input.type = 'password';
    if (icon) icon.textContent = 'visibility';
  }
};

/**
 * Saves the Fonnte token via API.
 */
SIKAP.Settings.saveFonnteToken = function() {
  var input = document.getElementById('wa-token-input');
  var btn = document.getElementById('wa-save-btn');
  var textEl = document.getElementById('wa-save-text');
  var tokenVal = input ? input.value.trim() : '';

  if (!tokenVal) {
    SIKAP.Toast.show('Masukkan token Fonnte terlebih dahulu.', 'warning');
    return;
  }

  if (btn) btn.disabled = true;
  if (textEl) textEl.textContent = 'Menyimpan...';

  SIKAP.Api.call('adminSaveFonnteToken', { token: SIKAP.state.token, fonnteToken: tokenVal })
    .then(function(result) {
      if (result && result.success) {
        SIKAP.Toast.show('Token Fonnte berhasil disimpan!', 'success');
        if (input) input.value = '';
        SIKAP.Settings.loadFonnteStatus();
      } else {
        SIKAP.Toast.show((result && result.message) || 'Gagal menyimpan token.', 'error');
      }
    })
    .catch(function() {
      SIKAP.Toast.show('Gagal menyimpan token. Periksa koneksi.', 'error');
    })
    .finally(function() {
      if (btn) btn.disabled = false;
      if (textEl) textEl.textContent = 'Simpan Token';
    });
};

/**
 * Sends a WhatsApp test message to the admin's registered phone number.
 */
SIKAP.Settings.testFonnteMessage = function() {
  var btn = document.getElementById('wa-test-btn');
  var textEl = document.getElementById('wa-test-text');

  if (btn) btn.disabled = true;
  if (textEl) textEl.textContent = 'Mengirim...';

  SIKAP.Api.call('adminTestFonnteMessage', { token: SIKAP.state.token })
    .then(function(result) {
      if (result && result.success) {
        SIKAP.Toast.show('Pesan uji berhasil dikirim ke WhatsApp Anda! 🎉', 'success', 5000);
      } else {
        SIKAP.Toast.show((result && result.message) || 'Gagal mengirim pesan uji.', 'error');
      }
    })
    .catch(function() {
      SIKAP.Toast.show('Gagal mengirim pesan uji. Periksa koneksi.', 'error');
    })
    .finally(function() {
      if (btn) btn.disabled = false;
      if (textEl) textEl.textContent = 'Kirim Pesan Uji';
    });
};
</script>
