<script>
// ============================================================
// JS_Pengaturan.html — Settings Page Controller
// ============================================================

SIKAP.Settings = SIKAP.Settings || {};

/**
 * Loads the user profile data into the Settings form.
 * Called when the settings view is shown.
 */
SIKAP.Settings.loadProfile = function() {
  SIKAP.Api.call('getUserProfile', { token: SIKAP.state.token })
    .then(function(result) {
      if (result && result.success) {
        var d = result.data;
        document.getElementById('settings-nama').value = d.nama || '—';
        document.getElementById('settings-nip').value = d.nip || '—';
        document.getElementById('settings-role').value = d.role || '—';
        document.getElementById('settings-status').value = d.statusKepegawaian || '—';
        // Tampilkan seksi Backup jika user adalah Admin
        SIKAP.Settings._checkAdminSections(d.role);
      } else {
        var msg = (result && result.message) ? result.message : 'Gagal memuat profil.';
        SIKAP.Toast.show(msg, 'error');
        if (result && result.message && result.message.indexOf('Sesi') !== -1) {
          SIKAP.Auth.handleSessionExpired();
        }
      }
    })
    .catch(function(error) {
      SIKAP.Toast.show('Gagal memuat profil.', 'error');
    });
};

/**
 * Validates the password change form in real-time.
 */
SIKAP.Settings.validatePasswordForm = function() {
  var newPw = document.getElementById('settings-new-pw').value;
  var confirmPw = document.getElementById('settings-confirm-pw').value;
  var submitBtn = document.getElementById('settings-save-pw-btn');
  var matchMsg = document.getElementById('settings-match-msg');

  var reqLength = document.getElementById('settings-req-length');
  var reqCase = document.getElementById('settings-req-case');
  var reqNumber = document.getElementById('settings-req-number');

  var hasLength = newPw.length >= 8;
  var hasCase = /[a-z]/.test(newPw) && /[A-Z]/.test(newPw);
  var hasNumber = /\d/.test(newPw);
  var isMatch = newPw === confirmPw && newPw !== '';

  SIKAP.Auth.updateReqStyle(reqLength, hasLength);
  SIKAP.Auth.updateReqStyle(reqCase, hasCase);
  SIKAP.Auth.updateReqStyle(reqNumber, hasNumber);

  if (confirmPw !== '') {
    if (!isMatch) {
      matchMsg.textContent = 'Password tidak cocok.';
      matchMsg.classList.remove('opacity-0');
    } else {
      matchMsg.textContent = '';
      matchMsg.classList.add('opacity-0');
    }
  } else {
    matchMsg.classList.add('opacity-0');
  }

  var isValid = hasLength && hasCase && hasNumber && isMatch;
  submitBtn.disabled = !isValid;
};

/**
 * Handles the voluntary password change form submission.
 */
SIKAP.Settings.handleChangePassword = function(event) {
  event.preventDefault();

  var currentPw = document.getElementById('settings-current-pw').value;
  var newPw = document.getElementById('settings-new-pw').value;
  var confirmPw = document.getElementById('settings-confirm-pw').value;
  var submitBtn = document.getElementById('settings-save-pw-btn');
  var textEl = document.getElementById('settings-save-pw-text');

  if (!currentPw) {
    SIKAP.Toast.show('Masukkan password saat ini.', 'warning');
    return;
  }
  if (newPw !== confirmPw) {
    SIKAP.Toast.show('Password baru tidak cocok.', 'error');
    return;
  }

  // Loading state
  submitBtn.disabled = true;
  textEl.innerHTML = '<svg class="animate-spin h-5 w-5 text-on-primary inline-block" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path></svg> Menyimpan...';

  SIKAP.Api.call('changePassword', { token: SIKAP.state.token, newPassword: newPw, currentPassword: currentPw })
    .then(function(result) {
      if (result && result.success) {
        SIKAP.Toast.show('Password berhasil diubah!', 'success');
        // Clear form
        document.getElementById('settings-current-pw').value = '';
        document.getElementById('settings-new-pw').value = '';
        document.getElementById('settings-confirm-pw').value = '';
        // Reset requirement indicators
        SIKAP.Settings.validatePasswordForm();
      } else {
        var msg = (result && result.message) ? result.message : 'Gagal mengubah password.';
        SIKAP.Toast.show(msg, 'error');
        if (result && result.message && result.message.indexOf('Sesi') !== -1) {
          SIKAP.Auth.handleSessionExpired();
        }
      }
      submitBtn.disabled = false;
      textEl.textContent = 'Simpan Password';
    })
    .catch(function(error) {
      SIKAP.Toast.show('Gagal menyimpan password. Coba lagi.', 'error');
      submitBtn.disabled = false;
      textEl.textContent = 'Simpan Password';
    });
};

// ---- Logout Confirmation Modal (delegated to global SIKAP.Auth) ----
SIKAP.Settings.openLogoutModal = function() {
  SIKAP.Auth.openLogoutModal();
};

SIKAP.Settings.closeLogoutModal = function() {
  SIKAP.Auth.closeLogoutModal();
};

SIKAP.Settings.confirmLogout = function() {
  SIKAP.Auth.confirmLogout();
};

/**
 * Menampilkan seksi Admin-only (Backup, WhatsApp) dan memuat status Fonnte.
 */
SIKAP.Settings._checkAdminSections = function(role) {
  var backupSection = document.getElementById('settings-backup-section');
  var waSection = document.getElementById('settings-whatsapp-section');
  var notifSection = document.getElementById('settings-notif-section');
  if (role === 'Admin') {
    if (backupSection) backupSection.classList.remove('hidden');
    if (notifSection) {
      notifSection.classList.remove('hidden');
      SIKAP.Settings.loadNotifSettings();
    }
    if (waSection) {
      waSection.classList.remove('hidden');
      SIKAP.Settings.loadFonnteStatus();
    }
  }
};

// Keep the old name for backward compatibility
SIKAP.Settings._checkBackupVisibility = SIKAP.Settings._checkAdminSections;

/**
 * Triggers a backup operation.
 * @param {'database'|'full'} type - Type of backup to perform.
 */
SIKAP.Settings.triggerBackup = function(type) {
  var isDb = (type === 'database');
  var btnId = isDb ? 'settings-backup-db-btn' : 'settings-backup-full-btn';
  var textId = isDb ? 'settings-backup-db-text' : 'settings-backup-full-text';
  var apiFunc = isDb ? 'adminBackupDatabase' : 'adminBackupFull';

  var btn = document.getElementById(btnId);
  var textEl = document.getElementById(textId);

  // Loading state
  if (btn) btn.disabled = true;
  if (textEl) textEl.innerHTML =
    '<svg class="animate-spin h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24">' +
    '<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>' +
    '<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>' +
    '</svg>' + (isDb ? 'Membuat backup...' : 'Membuat backup penuh...');

  SIKAP.Api.call(apiFunc, { token: SIKAP.state.token })
    .then(function(result) {
      if (result && result.success) {
        var msg = result.message;
        if (result.data && result.data.url) {
          msg += ' <a href="' + result.data.url + '" target="_blank" class="underline font-medium">Lihat di Drive</a>';
        }
        SIKAP.Toast.show(result.message + (result.data && result.data.docsCopied ? ' (' + result.data.docsCopied + ' file dokumen)' : ''), 'success', 6000);
      } else {
        SIKAP.Toast.show((result && result.message) ? result.message : 'Backup gagal.', 'error');
      }
    })
    .catch(function() {
      SIKAP.Toast.show('Backup gagal. Periksa koneksi dan coba lagi.', 'error');
    })
    .finally(function() {
      if (btn) btn.disabled = false;
      if (textEl) textEl.textContent = isDb ? 'Backup Database Sekarang' : 'Backup Penuh Sekarang';
    });
};

// ============================================================
// WhatsApp Gateway Settings
// ============================================================

/**
 * Loads WhatsApp provider status and updates all UI indicators.
 */
SIKAP.Settings.loadFonnteStatus = function() {
  SIKAP.Api.call('adminGetWaProvider', { token: SIKAP.state.token })
    .then(function(result) {
      if (!result || !result.success) return;
      var d = result.data;

      // Update Fonnte status indicator
      var dot = document.getElementById('wa-status-dot');
      var label = document.getElementById('wa-status-label');
      if (dot && label) {
        if (d.fonnte.isConfigured) {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 flex-shrink-0';
          label.textContent = 'Token terkonfigurasi (' + d.fonnte.tokenHint + '). Siap digunakan.';
        } else {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 flex-shrink-0';
          label.textContent = 'Token belum dikonfigurasi.';
        }
      }

      // Update Meta status indicator
      var metaDot = document.getElementById('wa-meta-status-dot');
      var metaLabel = document.getElementById('wa-meta-status-label');
      if (metaDot && metaLabel) {
        if (d.meta.isConfigured) {
          metaDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 flex-shrink-0';
          metaLabel.textContent = 'Token & Phone ID terkonfigurasi (' + d.meta.tokenHint + '). Siap digunakan.';
          // Pre-fill phone ID if available
          var phoneInput = document.getElementById('wa-meta-phone-id-input');
          if (phoneInput && d.meta.phoneId && !phoneInput.value) {
            phoneInput.value = d.meta.phoneId;
          }
        } else {
          metaDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 flex-shrink-0';
          metaLabel.textContent = 'Belum dikonfigurasi. Isi token dan Phone Number ID.';
        }
      }

      // Update active provider badges and button borders
      var activeProvider = d.activeProvider || 'fonnte';
      var fonnteBadge = document.getElementById('wa-fonnte-active-badge');
      var metaBadge = document.getElementById('wa-meta-active-badge');
      var fonnteBtn = document.getElementById('wa-provider-fonnte-btn');
      var metaBtn = document.getElementById('wa-provider-meta-btn');

      if (fonnteBadge) fonnteBadge.classList.toggle('hidden', activeProvider !== 'fonnte');
      if (metaBadge) metaBadge.classList.toggle('hidden', activeProvider !== 'meta');
      if (fonnteBtn) fonnteBtn.classList.toggle('border-primary', activeProvider === 'fonnte');
      if (metaBtn) metaBtn.classList.toggle('border-primary', activeProvider === 'meta');
    })
    .catch(function() {});
};

SIKAP.Settings.toggleWaTokenVisibility = function() {
  var input = document.getElementById('wa-token-input');
  var icon = document.getElementById('wa-token-vis-icon');
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
  if (icon) icon.textContent = input.type === 'password' ? 'visibility' : 'visibility_off';
};

SIKAP.Settings.toggleMetaTokenVisibility = function() {
  var input = document.getElementById('wa-meta-token-input');
  var icon = document.getElementById('wa-meta-token-vis-icon');
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
  if (icon) icon.textContent = input.type === 'password' ? 'visibility' : 'visibility_off';
};

SIKAP.Settings.setWaProvider = function(provider) {
  SIKAP.Api.call('adminSetWaProvider', { token: SIKAP.state.token, provider: provider })
    .then(function(result) {
      if (result && result.success) {
        SIKAP.Toast.show('Penyedia WhatsApp diubah ke ' + provider.toUpperCase() + '.', 'success');
        SIKAP.Settings.loadFonnteStatus();
      } else {
        SIKAP.Toast.show((result && result.message) || 'Gagal mengubah penyedia.', 'error');
      }
    })
    .catch(function() { SIKAP.Toast.show('Gagal mengubah penyedia.', 'error'); });
};

SIKAP.Settings.saveFonnteToken = function() {
  var input = document.getElementById('wa-token-input');
  var btn = document.getElementById('wa-save-btn');
  var textEl = document.getElementById('wa-save-text');
  var tokenVal = input ? input.value.trim() : '';

  if (!tokenVal) { SIKAP.Toast.show('Masukkan token Fonnte terlebih dahulu.', 'warning'); return; }
  if (btn) btn.disabled = true;
  if (textEl) textEl.textContent = 'Menyimpan...';

  SIKAP.Api.call('adminSaveFonnteToken', { token: SIKAP.state.token, fonnteToken: tokenVal })
    .then(function(result) {
      if (result && result.success) {
        SIKAP.Toast.show('Token Fonnte berhasil disimpan!', 'success');
        if (input) input.value = '';
        SIKAP.Settings.loadFonnteStatus();
      } else {
        SIKAP.Toast.show((result && result.message) || 'Gagal menyimpan token.', 'error');
      }
    })
    .catch(function() { SIKAP.Toast.show('Gagal menyimpan token.', 'error'); })
    .finally(function() {
      if (btn) btn.disabled = false;
      if (textEl) textEl.textContent = 'Simpan Token';
    });
};

SIKAP.Settings.testFonnteMessage = function() {
  var btn = document.getElementById('wa-test-btn');
  var textEl = document.getElementById('wa-test-text');
  if (btn) btn.disabled = true;
  if (textEl) textEl.textContent = 'Mengirim...';

  SIKAP.Api.call('adminTestFonnteMessage', { token: SIKAP.state.token })
    .then(function(result) {
      if (result && result.success) {
        SIKAP.Toast.show('Pesan uji berhasil dikirim ke WhatsApp Anda! 🎉', 'success', 5000);
      } else {
        SIKAP.Toast.show((result && result.message) || 'Gagal mengirim pesan uji.', 'error');
      }
    })
    .catch(function() { SIKAP.Toast.show('Gagal mengirim pesan uji.', 'error'); })
    .finally(function() {
      if (btn) btn.disabled = false;
      if (textEl) textEl.textContent = 'Kirim Pesan Uji';
    });
};

SIKAP.Settings.saveMetaConfig = function() {
  var tokenInput = document.getElementById('wa-meta-token-input');
  var phoneIdInput = document.getElementById('wa-meta-phone-id-input');
  var btn = document.getElementById('wa-meta-save-btn');
  var textEl = document.getElementById('wa-meta-save-text');
  var metaToken = tokenInput ? tokenInput.value.trim() : '';
  var metaPhoneId = phoneIdInput ? phoneIdInput.value.trim() : '';

  if (!metaToken) { SIKAP.Toast.show('Masukkan Meta Access Token terlebih dahulu.', 'warning'); return; }
  if (!metaPhoneId) { SIKAP.Toast.show('Masukkan Phone Number ID terlebih dahulu.', 'warning'); return; }

  if (btn) btn.disabled = true;
  if (textEl) textEl.textContent = 'Menyimpan...';

  SIKAP.Api.call('adminSaveMetaConfig', { token: SIKAP.state.token, metaToken: metaToken, metaPhoneId: metaPhoneId })
    .then(function(result) {
      if (result && result.success) {
        SIKAP.Toast.show('Konfigurasi Meta WhatsApp berhasil disimpan! ✅', 'success');
        if (tokenInput) tokenInput.value = '';
        SIKAP.Settings.loadFonnteStatus();
      } else {
        SIKAP.Toast.show((result && result.message) || 'Gagal menyimpan konfigurasi Meta.', 'error');
      }
    })
    .catch(function() { SIKAP.Toast.show('Gagal menyimpan konfigurasi Meta.', 'error'); })
    .finally(function() {
      if (btn) btn.disabled = false;
      if (textEl) textEl.textContent = 'Simpan Konfigurasi';
    });
};

SIKAP.Settings.testMetaMessage = function() {
  var btn = document.getElementById('wa-meta-test-btn');
  var textEl = document.getElementById('wa-meta-test-text');
  if (btn) btn.disabled = true;
  if (textEl) textEl.textContent = 'Mengirim...';

  SIKAP.Api.call('adminTestMetaMessage', { token: SIKAP.state.token })
    .then(function(result) {
      if (result && result.success) {
        SIKAP.Toast.show('Pesan uji Meta berhasil dikirim ke WhatsApp Anda! 🎉', 'success', 5000);
      } else {
        SIKAP.Toast.show((result && result.message) || 'Gagal mengirim pesan uji Meta.', 'error');
      }
    })
    .catch(function() { SIKAP.Toast.show('Gagal mengirim pesan uji Meta.', 'error'); })
    .finally(function() {
      if (btn) btn.disabled = false;
      if (textEl) textEl.textContent = 'Kirim Pesan Uji (Meta)';
    });
};

// ============================================================
// Notification Toggle Settings
// ============================================================

/**
 * Loads notification toggle states from the backend and sets checkbox states.
 */
SIKAP.Settings.loadNotifSettings = function() {
  SIKAP.Api.call('adminGetNotifSettings', { token: SIKAP.state.token })
    .then(function(result) {
      if (result && result.success && result.data) {
        var d = result.data;
        var elBaru = document.getElementById('notif-toggle-baru');
        var elApproved = document.getElementById('notif-toggle-approved');
        var elRejected = document.getElementById('notif-toggle-rejected');
        if (elBaru) elBaru.checked = !!d.dokumenBaru;
        if (elApproved) elApproved.checked = !!d.dokumenApproved;
        if (elRejected) elRejected.checked = !!d.dokumenRejected;
      }
    })
    .catch(function() {
      // Silent failure — toggles will default to unchecked
    });
};

/**
 * Reads the current toggle states from the UI and saves them to the backend.
 * Called automatically on checkbox change.
 */
SIKAP.Settings.saveNotifToggle = function() {
  var elBaru = document.getElementById('notif-toggle-baru');
  var elApproved = document.getElementById('notif-toggle-approved');
  var elRejected = document.getElementById('notif-toggle-rejected');
  var statusEl = document.getElementById('notif-save-status');

  var settings = {
    dokumenBaru: elBaru ? elBaru.checked : true,
    dokumenApproved: elApproved ? elApproved.checked : true,
    dokumenRejected: elRejected ? elRejected.checked : true
  };

  if (statusEl) {
    statusEl.textContent = 'Menyimpan...';
    statusEl.style.opacity = '1';
  }

  SIKAP.Api.call('adminSaveNotifSettings', { token: SIKAP.state.token, settings: settings })
    .then(function(result) {
      if (result && result.success) {
        if (statusEl) {
          statusEl.textContent = '✓ Pengaturan notifikasi tersimpan.';
          statusEl.classList.remove('text-error');
          statusEl.classList.add('text-emerald-600');
        }
      } else {
        if (statusEl) {
          statusEl.textContent = '✗ Gagal menyimpan: ' + ((result && result.message) || 'Kesalahan tidak diketahui.');
          statusEl.classList.remove('text-emerald-600');
          statusEl.classList.add('text-error');
        }
      }
      // Fade out after 3 seconds
      setTimeout(function() {
        if (statusEl) statusEl.style.opacity = '0';
      }, 3000);
    })
    .catch(function() {
      if (statusEl) {
        statusEl.textContent = '✗ Gagal menyimpan pengaturan.';
        statusEl.classList.remove('text-emerald-600');
        statusEl.classList.add('text-error');
        statusEl.style.opacity = '1';
      }
    });
};
</script>
