<script>
// ============================================================
// JS_MasterDataPegawai.html — Admin Master Data Controller
// ============================================================

SIKAP.MasterDataPegawai = SIKAP.MasterDataPegawai || {};

// Internal state
SIKAP.MasterDataPegawai._allRows = [];       // Full dataset from backend
SIKAP.MasterDataPegawai._filteredRows = [];  // After filter/search
SIKAP.MasterDataPegawai._page = 1;
SIKAP.MasterDataPegawai._pageSize = 15;
SIKAP.MasterDataPegawai._editTarget = null;  // NIP of row being edited
SIKAP.MasterDataPegawai._toggleTarget = null;// { nip, nama, currentStatus }
SIKAP.MasterDataPegawai._tambahFoto = null;  // { base64, mimeType }
SIKAP.MasterDataPegawai._editFoto = null;    // { base64, mimeType }

// ---- Helpers ----

SIKAP.MasterDataPegawai.getInitials = function(nama) {
  if (!nama) return '?';
  var parts = nama.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
  return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
};

SIKAP.MasterDataPegawai.avatarStyles = [
  'bg-blue-50 text-blue-700 border-blue-200/60',
  'bg-indigo-50 text-indigo-700 border-indigo-200/60',
  'bg-sky-50 text-sky-700 border-sky-200/60',
  'bg-violet-50 text-violet-700 border-violet-200/60',
  'bg-slate-100 text-slate-700 border-slate-200'
];

SIKAP.MasterDataPegawai.getAvatarStyle = function(nip) {
  var sum = 0;
  for (var i = 0; i < nip.length; i++) sum += nip.charCodeAt(i);
  return SIKAP.MasterDataPegawai.avatarStyles[sum % SIKAP.MasterDataPegawai.avatarStyles.length];
};

SIKAP.MasterDataPegawai.statusAkunBadge = function(status) {
  if (status === 'Aktif') {
    return '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/60 shadow-2xs">' +
      '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Aktif</span>';
  }
  return '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-surface-container-high text-on-surface-variant border border-outline-variant/30 shadow-2xs">' +
    '<span class="w-1.5 h-1.5 rounded-full bg-outline"></span>Nonaktif</span>';
};

SIKAP.MasterDataPegawai.statusKepegawaianBadge = function(status) {
  var st = String(status || '—').toUpperCase();
  if (st === 'PNS') {
    return '<span class="px-2.5 py-0.5 bg-blue-50 text-blue-700 font-semibold text-xs rounded-md border border-blue-200/60 inline-flex items-center">PNS</span>';
  } else if (st === 'CPNS') {
    return '<span class="px-2.5 py-0.5 bg-purple-50 text-purple-700 font-semibold text-xs rounded-md border border-purple-200/60 inline-flex items-center">CPNS</span>';
  } else if (st === 'PPPK' || st === 'P3K') {
    return '<span class="px-2.5 py-0.5 bg-teal-50 text-teal-700 font-semibold text-xs rounded-md border border-teal-200/60 inline-flex items-center">PPPK</span>';
  }
  return '<span class="px-2.5 py-0.5 bg-surface-container-high text-on-surface-variant font-medium text-xs rounded-md">' + SIKAP.escapeHtml(status || '—') + '</span>';
};

SIKAP.MasterDataPegawai.completenessBar = function(pct, label) {
  var numPct = parseInt(pct, 10) || 0;
  var isLengkap = label === 'Lengkap' || numPct === 100;
  var isRevisi = label === 'Perlu Revisi';
  
  var barColor = isLengkap ? 'bg-emerald-500' : (isRevisi ? 'bg-rose-500' : (numPct > 0 ? 'bg-primary' : 'bg-slate-300'));
  var badgeClass = isLengkap
    ? 'bg-emerald-50 text-emerald-700 border-emerald-200/60'
    : (isRevisi 
      ? 'bg-rose-50 text-rose-700 border-rose-200/60' 
      : 'bg-surface-container-high text-on-surface-variant border-outline-variant/30');

  return '<div class="flex flex-col gap-1.5 w-full max-w-[160px]">' +
    '<div class="flex items-center justify-between">' +
      '<span class="text-xs font-bold text-on-surface font-mono">' + numPct + '%</span>' +
      '<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ' + badgeClass + '">' + SIKAP.escapeHtml(label || 'Belum Lengkap') + '</span>' +
    '</div>' +
    '<div class="w-full bg-surface-container-highest rounded-full h-1.5 overflow-hidden">' +
      '<div class="' + barColor + ' h-1.5 rounded-full transition-all duration-500" style="width:' + numPct + '%"></div>' +
    '</div>' +
  '</div>';
};

// ---- Photo Handling & Previews ----

SIKAP.MasterDataPegawai.handleFotoChange = function(inputEl, mode) {
  var file = inputEl.files && inputEl.files[0];
  if (!file) return;

  // Max 5MB
  if (file.size > 5 * 1024 * 1024) {
    SIKAP.Toast.show('Ukuran file foto melebihi batas 5 MB.', 'error');
    inputEl.value = '';
    return;
  }

  // Allowed MIME
  var allowedTypes = ['image/jpeg', 'image/jpg', 'image/png'];
  if (allowedTypes.indexOf(file.type.toLowerCase()) === -1) {
    SIKAP.Toast.show('Format foto tidak valid. Gunakan format JPG, JPEG, atau PNG.', 'error');
    inputEl.value = '';
    return;
  }

  SIKAP.MasterDataPegawai._cropMode = mode;
  SIKAP.MasterDataPegawai._cropMimeType = file.type;

  var reader = new FileReader();
  reader.onload = function(e) {
    var cropImg = document.getElementById('master-crop-img');
    cropImg.src = e.target.result;
    
    document.getElementById('master-crop-modal').classList.remove('hidden');
    
    if (SIKAP.MasterDataPegawai._cropper) {
      SIKAP.MasterDataPegawai._cropper.destroy();
    }
    
    SIKAP.MasterDataPegawai._cropper = new Cropper(cropImg, {
      aspectRatio: 1,
      viewMode: 1,
      dragMode: 'move',
      autoCropArea: 1,
      restore: false,
      guides: true,
      center: true,
      highlight: false,
      cropBoxMovable: true,
      cropBoxResizable: true,
      toggleDragModeOnDblclick: false,
    });
  };
  reader.readAsDataURL(file);
};

SIKAP.MasterDataPegawai.closeCropModal = function() {
  document.getElementById('master-crop-modal').classList.add('hidden');
  if (SIKAP.MasterDataPegawai._cropper) {
    SIKAP.MasterDataPegawai._cropper.destroy();
    SIKAP.MasterDataPegawai._cropper = null;
  }
  var inputEl = document.getElementById(SIKAP.MasterDataPegawai._cropMode + '-foto-input');
  if (inputEl) inputEl.value = '';
};

SIKAP.MasterDataPegawai.cropAndSave = function() {
  if (!SIKAP.MasterDataPegawai._cropper) return;
  
  var canvas = SIKAP.MasterDataPegawai._cropper.getCroppedCanvas({
    width: 600,
    height: 600
  });
  
  if (!canvas) {
    SIKAP.Toast.show('Gagal memproses foto.', 'error');
    return;
  }
  
  var mode = SIKAP.MasterDataPegawai._cropMode;
  var mimeType = SIKAP.MasterDataPegawai._cropMimeType || 'image/jpeg';
  var dataUrl = canvas.toDataURL(mimeType, 0.85);
  var base64Part = dataUrl.split(',')[1];
  
  // Store cropped base64
  if (mode === 'tambah') {
    SIKAP.MasterDataPegawai._tambahFoto = { base64: base64Part, mimeType: mimeType };
  } else {
    SIKAP.MasterDataPegawai._editFoto = { base64: base64Part, mimeType: mimeType };
  }
  
  // Update Preview UI
  var previewImg = document.getElementById(mode + '-foto-preview');
  var placeholder = document.getElementById(mode + '-foto-placeholder');
  var removeBtn = document.getElementById(mode + '-foto-remove');

  previewImg.src = dataUrl;
  previewImg.classList.remove('hidden');
  placeholder.classList.add('hidden');
  if (removeBtn) removeBtn.classList.remove('hidden');
  
  SIKAP.MasterDataPegawai.closeCropModal();
};

SIKAP.MasterDataPegawai.removeFoto = function(mode) {
  var inputEl = document.getElementById(mode + '-foto-input');
  var previewImg = document.getElementById(mode + '-foto-preview');
  var placeholder = document.getElementById(mode + '-foto-placeholder');
  var removeBtn = document.getElementById(mode + '-foto-remove');

  if (inputEl) inputEl.value = '';
  if (previewImg) {
    previewImg.src = '';
    previewImg.classList.add('hidden');
  }
  if (placeholder) placeholder.classList.remove('hidden');
  if (removeBtn) removeBtn.classList.add('hidden');

  if (mode === 'tambah') {
    SIKAP.MasterDataPegawai._tambahFoto = null;
  } else {
    SIKAP.MasterDataPegawai._editFoto = null;
  }
};

// ---- Table Rendering ----

SIKAP.MasterDataPegawai.renderTable = function() {
  var rows = SIKAP.MasterDataPegawai._filteredRows;
  var page = SIKAP.MasterDataPegawai._page;
  var size = SIKAP.MasterDataPegawai._pageSize;
  var start = (page - 1) * size;
  var pageRows = rows.slice(start, start + size);
  var totalPages = Math.ceil(rows.length / size);

  var tbody = document.getElementById('mdp-tbody');
  if (!tbody) return;

  if (pageRows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-on-surface-variant font-body-md">' +
      '<div class="flex flex-col items-center justify-center gap-2">' +
        '<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-outline">' +
          '<span class="material-symbols-outlined text-2xl">search_off</span>' +
        '</div>' +
        '<span class="font-medium text-sm text-on-surface">Tidak ada data pegawai yang sesuai</span>' +
        '<span class="text-xs text-on-surface-variant">Coba ubah kata kunci pencarian atau filter status</span>' +
      '</div>' +
    '</td></tr>';
  } else {
    tbody.innerHTML = pageRows.map(function(r) {
      var initials = SIKAP.MasterDataPegawai.getInitials(r.nama);
      var avatarStyle = SIKAP.MasterDataPegawai.getAvatarStyle(r.nip);
      var toggleIcon = r.statusAkun === 'Aktif' ? 'block' : 'check_circle';
      var toggleTitle = r.statusAkun === 'Aktif' ? 'Nonaktifkan Akun' : 'Aktifkan Akun';
      var safeNama = SIKAP.escapeHtml(r.nama);
      var safeNip = SIKAP.escapeHtml(r.nip);
      var safePangkat = SIKAP.escapeHtml(r.pangkatGolongan || '—');
      var safeJabatan = SIKAP.escapeHtml(r.jabatan || '—');

      var avatarHtml = r.fotoUrl
        ? '<img src="' + r.fotoUrl + '" alt="' + safeNama + '" class="w-10 h-10 rounded-xl object-cover shrink-0 border border-outline-variant/30 shadow-xs">'
        : '<div class="w-10 h-10 rounded-xl flex items-center justify-center font-label-md font-bold text-xs shrink-0 border shadow-xs ' + avatarStyle + '">' + initials + '</div>';

      return '<tr class="hover:bg-surface-container-lowest/80 transition-colors group">' +
        // Col 1: Pegawai
        '<td class="px-6 py-4">' +
          '<div class="flex items-center gap-3">' +
            avatarHtml +
            '<div class="flex flex-col min-w-0">' +
              '<span class="font-label-md text-on-surface font-semibold text-sm truncate">' + safeNama + '</span>' +
              '<span class="font-body-sm text-on-surface-variant text-xs font-mono mt-0.5 truncate">NIP: ' + safeNip + '</span>' +
            '</div>' +
          '</div>' +
        '</td>' +
        // Col 2: Status / Golongan
        '<td class="px-6 py-4">' +
          '<div class="flex flex-col items-start gap-1">' +
            SIKAP.MasterDataPegawai.statusKepegawaianBadge(r.statusKepegawaian) +
            '<span class="text-xs text-on-surface-variant truncate">' + safePangkat + '</span>' +
          '</div>' +
        '</td>' +
        // Col 3: Jabatan
        '<td class="px-6 py-4">' +
          '<span class="font-body-md text-on-surface text-sm font-medium truncate block max-w-[150px]" title="' + safeJabatan + '">' + safeJabatan + '</span>' +
        '</td>' +
        // Col 4: Kelengkapan
        '<td class="px-6 py-4">' +
          SIKAP.MasterDataPegawai.completenessBar(r.docPct, r.docLabel) +
        '</td>' +
        // Col 5: Status Akun
        '<td class="px-6 py-4 text-center">' +
          SIKAP.MasterDataPegawai.statusAkunBadge(r.statusAkun) +
        '</td>' +
        // Col 6: Aksi
        '<td class="px-6 py-4 text-right">' +
          '<div class="flex items-center justify-end gap-1.5">' +
            '<button class="px-3 py-1.5 bg-primary text-on-primary hover:bg-primary/90 rounded-lg font-label-sm text-xs transition-all flex items-center gap-1.5 shadow-xs active:scale-95 cursor-pointer" title="Detail & Edit Pegawai"' +
              ' onclick="SIKAP.MasterDataPegawai.openEdit(\'' + safeNip + '\')">' +
              '<span class="material-symbols-outlined text-[16px]">edit</span>' +
              '<span>Edit</span>' +
            '</button>' +
            '<button class="p-1.5 text-on-surface-variant hover:text-error hover:bg-error-container/20 rounded-lg transition-colors border border-outline-variant/30 hover:border-error/30 cursor-pointer" title="' + toggleTitle + '"' +
              ' onclick="SIKAP.MasterDataPegawai.openConfirm(\'' + safeNip + '\', \'' + safeNama.replace(/'/g, '\\\'') + '\', \'' + r.statusAkun + '\')">' +
              '<span class="material-symbols-outlined text-[18px]">' + toggleIcon + '</span>' +
            '</button>' +
            '<button class="p-1.5 text-on-surface-variant hover:text-error hover:bg-error-container/20 rounded-lg transition-colors border border-outline-variant/30 hover:border-error/30 cursor-pointer" title="Hapus Data Pegawai"' +
              ' onclick="SIKAP.MasterDataPegawai.openDeleteModal(\'' + safeNip + '\', \'' + safeNama.replace(/'/g, '\\\'') + '\')">' +
              '<span class="material-symbols-outlined text-[18px]">delete</span>' +
            '</button>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  // Pagination
  document.getElementById('mdp-count-label').textContent =
    'Menampilkan ' + (rows.length === 0 ? 0 : start + 1) + '–' +
    Math.min(start + size, rows.length) + ' dari ' + rows.length + ' Pegawai';
  document.getElementById('mdp-page-label').textContent = 'Hal. ' + page + ' / ' + Math.max(totalPages, 1);
  document.getElementById('mdp-prev-btn').disabled = page <= 1;
  document.getElementById('mdp-next-btn').disabled = page >= totalPages;
};

// ---- Filter / Search ----

SIKAP.MasterDataPegawai.applyFilters = function() {
  var q = (document.getElementById('mdp-search').value || '').toLowerCase();
  var filterKep = document.getElementById('mdp-filter-kepegawaian').value;
  var filterAkun = document.getElementById('mdp-filter-akun').value;
  var filterLen = document.getElementById('mdp-filter-kelengkapan').value;

  SIKAP.MasterDataPegawai._filteredRows = SIKAP.MasterDataPegawai._allRows.filter(function(r) {
    if (q && r.nama.toLowerCase().indexOf(q) === -1 && r.nip.indexOf(q) === -1) return false;
    if (filterKep && r.statusKepegawaian !== filterKep) return false;
    if (filterAkun && r.statusAkun !== filterAkun) return false;
    if (filterLen && r.docLabel !== filterLen) return false;
    return true;
  });
  SIKAP.MasterDataPegawai._page = 1;
  SIKAP.MasterDataPegawai.renderTable();
};

SIKAP.MasterDataPegawai.resetFilters = function() {
  document.getElementById('mdp-search').value = '';
  document.getElementById('mdp-filter-kepegawaian').value = '';
  document.getElementById('mdp-filter-akun').value = '';
  document.getElementById('mdp-filter-kelengkapan').value = '';
  SIKAP.MasterDataPegawai._filteredRows = SIKAP.MasterDataPegawai._allRows.slice();
  SIKAP.MasterDataPegawai._page = 1;
  SIKAP.MasterDataPegawai.renderTable();
};

SIKAP.MasterDataPegawai.prevPage = function() {
  if (SIKAP.MasterDataPegawai._page > 1) {
    SIKAP.MasterDataPegawai._page--;
    SIKAP.MasterDataPegawai.renderTable();
  }
};

SIKAP.MasterDataPegawai.nextPage = function() {
  var totalPages = Math.ceil(SIKAP.MasterDataPegawai._filteredRows.length / SIKAP.MasterDataPegawai._pageSize);
  if (SIKAP.MasterDataPegawai._page < totalPages) {
    SIKAP.MasterDataPegawai._page++;
    SIKAP.MasterDataPegawai.renderTable();
  }
};

// ---- Data Load ----

SIKAP.MasterDataPegawai.load = function() {
  document.getElementById('mdp-loading').classList.remove('hidden');
  document.getElementById('mdp-error').classList.add('hidden');
  document.getElementById('mdp-data').classList.add('hidden');

  SIKAP.Api.call('adminGetAllPegawai', { token: SIKAP.state.token })
    .then(function(result) {
      document.getElementById('mdp-loading').classList.add('hidden');
      if (result.success) {
        SIKAP.MasterDataPegawai._allRows = result.data.rows;
        SIKAP.MasterDataPegawai._filteredRows = result.data.rows.slice();
        document.getElementById('mdp-summary-text').textContent =
          result.data.summary.total + ' pegawai · ' +
          result.data.summary.aktif + ' aktif · ' +
          result.data.summary.nonaktif + ' nonaktif';
        SIKAP.MasterDataPegawai._page = 1;
        SIKAP.MasterDataPegawai.renderTable();
        document.getElementById('mdp-data').classList.remove('hidden');
      } else {
        document.getElementById('mdp-error-msg').textContent = result.message;
        document.getElementById('mdp-error').classList.remove('hidden');
        if (result.message && result.message.indexOf('Sesi') !== -1) SIKAP.Auth.handleSessionExpired();
      }
    })
    .catch(function(err) {
      document.getElementById('mdp-loading').classList.add('hidden');
      document.getElementById('mdp-error-msg').textContent = 'Gagal terhubung ke server.';
      document.getElementById('mdp-error').classList.remove('hidden');
    });
};

// ---- Delete Pegawai ----

SIKAP.MasterDataPegawai.openDeleteModal = function(nip, nama) {
  SIKAP.MasterDataPegawai._targetDelete = nip;
  
  document.getElementById('mdp-delete-nama').textContent = nama;
  document.getElementById('mdp-delete-nip').textContent = nip;
  
  var modal = document.getElementById('mdp-delete-modal');
  var card = document.getElementById('mdp-delete-card');
  
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  setTimeout(function() {
    card.classList.remove('scale-95', 'opacity-0');
    card.classList.add('scale-100', 'opacity-100');
  }, 10);
};

SIKAP.MasterDataPegawai.closeDeleteModal = function() {
  SIKAP.MasterDataPegawai._targetDelete = null;
  var card = document.getElementById('mdp-delete-card');
  
  card.classList.remove('scale-100', 'opacity-100');
  card.classList.add('scale-95', 'opacity-0');
  setTimeout(function() {
    var modal = document.getElementById('mdp-delete-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }, 200);
};

SIKAP.MasterDataPegawai.executeDelete = function() {
  if (!SIKAP.MasterDataPegawai._targetDelete) return;
  
  var nip = SIKAP.MasterDataPegawai._targetDelete;
  var btn = document.getElementById('mdp-delete-action-btn');
  var text = document.getElementById('mdp-delete-action-text');
  var cancelBtn = document.getElementById('mdp-delete-cancel-btn');
  var originalText = text.textContent;
  
  btn.disabled = true;
  cancelBtn.disabled = true;
  text.innerHTML = '<svg class="animate-spin h-4 w-4 mr-2 inline-block" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path></svg> Menghapus...';
  
  SIKAP.Api.call('adminDeletePegawai', { token: SIKAP.state.token, targetNip: nip })
    .then(function(result) {
      if (result && result.success) {
        SIKAP.Toast.show(result.message, 'success');
        SIKAP.MasterDataPegawai.closeDeleteModal();
        SIKAP.MasterDataPegawai.load(); // Reload table
      } else {
        SIKAP.Toast.show(result ? result.message : 'Gagal menghapus pegawai.', 'error');
      }
    })
    .catch(function(err) {
      SIKAP.Toast.show('Terjadi kesalahan koneksi.', 'error');
    })
    .finally(function() {
      btn.disabled = false;
      cancelBtn.disabled = false;
      text.textContent = 'Ya, Hapus';
    });
};

// ---- Tambah Panel ----

SIKAP.MasterDataPegawai.openTambah = function() {
  document.getElementById('mdp-tambah-form').reset();
  SIKAP.MasterDataPegawai.removeFoto('tambah');
  document.getElementById('tambah-nip-err').classList.add('hidden');
  document.getElementById('tambah-nik-err').classList.add('hidden');
  
  var panel = document.getElementById('mdp-tambah-panel');
  panel.classList.remove('hidden');
  panel.classList.add('flex');
  setTimeout(function() {
    document.getElementById('mdp-tambah-slide').classList.remove('translate-x-full');
  }, 10);
};

SIKAP.MasterDataPegawai.closeTambah = function() {
  document.getElementById('mdp-tambah-slide').classList.add('translate-x-full');
  setTimeout(function() {
    document.getElementById('mdp-tambah-panel').classList.add('hidden');
    document.getElementById('mdp-tambah-panel').classList.remove('flex');
  }, 300);
};

SIKAP.MasterDataPegawai.handleTambah = function(event) {
  event.preventDefault();
  
  var nipVal = (document.getElementById('tambah-nip').value || '').trim();
  var nikVal = (document.getElementById('tambah-nik').value || '').trim();
  var namaVal = (document.getElementById('tambah-nama').value || '').trim();
  var statusKepVal = document.getElementById('tambah-status-kepegawaian').value;
  var roleVal = document.getElementById('tambah-role').value;

  // Frontend Validations
  var hasError = false;
  if (!/^\d{18}$/.test(nipVal)) {
    document.getElementById('tambah-nip-err').classList.remove('hidden');
    document.getElementById('tambah-nip').focus();
    hasError = true;
  } else {
    document.getElementById('tambah-nip-err').classList.add('hidden');
  }

  if (nikVal && !/^\d{16}$/.test(nikVal)) {
    document.getElementById('tambah-nik-err').classList.remove('hidden');
    if (!hasError) document.getElementById('tambah-nik').focus();
    hasError = true;
  } else {
    document.getElementById('tambah-nik-err').classList.add('hidden');
  }

  if (!namaVal) {
    SIKAP.Toast.show('Nama lengkap wajib diisi.', 'error');
    hasError = true;
  }

  var noHpVal = (document.getElementById('tambah-hp').value || '').trim();
  var emailVal = (document.getElementById('tambah-email').value || '').trim();

  // Contact validations
  if (noHpVal) {
    var cleanPhone = noHpVal.replace(/[\s\-]/g, '');
    if (!/^(\+62|62|0)8[1-9][0-9]{6,11}$/.test(cleanPhone) && !/^(0[2-9][0-9]{1,3})[0-9]{5,8}$/.test(cleanPhone)) {

            token: SIKAP.state.token,

SIKAP.MasterDataPegawai.setSelectValue = function(selectEl, value) {
  if (!selectEl) return;
  if (!value) {
    selectEl.value = '';
    return;
  }
  var valStr = String(value).trim();
  for (var i = 0; i < selectEl.options.length; i++) {
    if (selectEl.options[i].value === valStr) {
      selectEl.selectedIndex = i;
      return;
    }
  }
  var match = valStr.match(/(IV|III|II|I)\/?[a-e]/i) || valStr.match(/(IV|III|II|I)\.[a-e]/i);
  if (match) {
    var grade = match[0].toUpperCase().replace('.', '/');
    for (var j = 0; j < selectEl.options.length; j++) {
      if (selectEl.options[j].value.toUpperCase().indexOf('(' + grade + ')') !== -1) {
        selectEl.selectedIndex = j;
        return;
      }
    }
  }
  var newOpt = document.createElement('option');
  newOpt.value = valStr;
  newOpt.textContent = valStr;
  newOpt.selected = true;
  selectEl.appendChild(newOpt);
};

SIKAP.MasterDataPegawai.openEdit = function(nip) {
  SIKAP.MasterDataPegawai._editTarget = nip;
  SIKAP.MasterDataPegawai.removeFoto('edit');
  document.getElementById('edit-nik-err').classList.add('hidden');

  var panel = document.getElementById('mdp-edit-panel');
  panel.classList.remove('hidden');
  panel.classList.add('flex');
  document.getElementById('edit-loading').classList.remove('hidden');
  document.getElementById('mdp-edit-form').classList.add('hidden');
  setTimeout(function() {
    document.getElementById('mdp-edit-slide').classList.remove('translate-x-full');
  }, 10);

  SIKAP.Api.call('adminGetPegawaiDetail', { token: SIKAP.state.token, targetNip: nip })
    .then(function(result) {
      document.getElementById('edit-loading').classList.add('hidden');
      document.getElementById('mdp-edit-form').classList.remove('hidden');
      if (result.success) {
        var d = result.data;
        document.getElementById('edit-header-nip').textContent = 'NIP: ' + d.nip;
        document.getElementById('edit-ro-nip').textContent = d.nip;

        // IDENTITAS
        document.getElementById('edit-nik').value = d.nik || '';
        document.getElementById('edit-nama').value = d.nama || '';
        document.getElementById('edit-tempat-lahir').value = d.tempatLahir || '';
        document.getElementById('edit-tanggal-lahir').value = d.tanggalLahir || '';
        document.getElementById('edit-jenis-kelamin').value = d.jenisKelamin || '';
        document.getElementById('edit-agama').value = d.agama || '';
        SIKAP.MasterDataPegawai.setSelectValue(document.getElementById('edit-pendidikan'), d.pendidikanTerakhir);
        document.getElementById('edit-status-pernikahan').value = d.statusPernikahan || '';
        document.getElementById('edit-goldar').value = d.golonganDarah || '';

        // Foto preview
        var previewImg = document.getElementById('edit-foto-preview');
        var placeholder = document.getElementById('edit-foto-placeholder');
        if (d.fotoUrl) {
          previewImg.src = d.fotoUrl;
          previewImg.classList.remove('hidden');
          placeholder.classList.add('hidden');
        } else {
          previewImg.src = '';
          previewImg.classList.add('hidden');
          placeholder.classList.remove('hidden');
        }

        // KEPEGAWAIAN
        document.getElementById('edit-status-kep').value = d.statusKepegawaian || 'PNS';
        SIKAP.MasterDataPegawai.setSelectValue(document.getElementById('edit-pangkat'), d.pangkatGolongan);

        document.getElementById('edit-jenis-jabatan').value = d.jenisJabatan || '';
        document.getElementById('edit-jabatan').value = d.jabatan || '';
        document.getElementById('edit-tmt-jabatan').value = d.tmtJabatan || '';
        SIKAP.MasterDataPegawai.setSelectValue(document.getElementById('edit-unit-organisasi'), d.unitOrganisasi);

        // KONTAK & SISTEM
        document.getElementById('edit-hp').value = d.noHp || '';
        document.getElementById('edit-email').value = d.email || '';
        document.getElementById('edit-role').value = d.role || 'Pegawai';
        document.getElementById('edit-status-akun').value = d.statusAkun || 'Aktif';
        document.getElementById('edit-alamat').value = d.alamat || '';

        // ARSIP DOKUMEN PEGAWAI
        SIKAP.MasterDataPegawai.loadEmployeeDocs(nip);
      } else {
        SIKAP.MasterDataPegawai.closeEdit();
        SIKAP.Toast.show(result.message, 'error');
      }
    })
    .catch(function() {
      SIKAP.MasterDataPegawai.closeEdit();
      SIKAP.Toast.show('Gagal memuat data pegawai.', 'error');
    });
};

SIKAP.MasterDataPegawai.loadEmployeeDocs = function(nip) {
  SIKAP.Api.call('getArsipDokumenPegawai', { token: SIKAP.state.token, targetNip: nip })
    .then(function(res) {
      if (res.success) {
        var d = res.data;
        var badge = document.getElementById('edit-doc-summary-badge');
        if (badge) {
          badge.textContent = (d.availableCount || 0) + ' dari ' + (d.totalDocs || 11) + ' tersedia';
        }

        var renderItem = function(item) {
          var isAvail = item.isAvailable;
          var safeName = SIKAP.escapeHtml(item.nama);
          var statusBadge = isAvail
            ? '<span class="text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200/60">Tersedia</span>'
            : '<span class="text-[11px] text-on-surface-variant bg-surface-container px-2 py-0.5 rounded">Belum diunggah</span>';

          var viewBtn = (isAvail && item.fileUrl)
            ? '<a href="' + encodeURI(item.fileUrl) + '" target="_blank" class="p-1 text-on-surface-variant hover:text-primary transition-colors" title="Buka Dokumen"><span class="material-symbols-outlined text-[16px]">open_in_new</span></a>'
            : '';

          return '<div class="p-2.5 rounded-lg border border-outline-variant/30 bg-surface-container-low/40 flex items-center justify-between gap-2">' +
            '<div class="flex items-center gap-2 min-w-0">' +
              '<span class="material-symbols-outlined text-[16px] ' + (isAvail ? 'text-emerald-700' : 'text-on-surface-variant') + '">' + (isAvail ? 'description' : 'hourglass_empty') + '</span>' +
              '<span class="text-xs text-on-surface font-medium truncate">' + safeName + '</span>' +
            '</div>' +
            '<div class="flex items-center gap-1.5 shrink-0">' + statusBadge + viewBtn + '</div>' +
          '</div>';
        };

        var wajibContainer = document.getElementById('edit-wajib-doc-list');
        if (wajibContainer && d.wajibRows) {
          wajibContainer.innerHTML = d.wajibRows.map(renderItem).join('');
          var wajibTitle = document.getElementById('edit-wajib-doc-title');
          if (wajibTitle) wajibTitle.textContent = 'Dokumen Wajib (' + d.wajibRows.length + ' Dokumen)';
        }

        var opsContainer = document.getElementById('edit-opsional-doc-list');
        if (opsContainer && d.opsionalRows) {
          opsContainer.innerHTML = d.opsionalRows.map(renderItem).join('');
          var opsTitle = document.getElementById('edit-opsional-doc-title');
          if (opsTitle) opsTitle.textContent = 'Dokumen Opsional (' + d.opsionalRows.length + ' Dokumen)';
        }
      }
    });
};

// ---- Confirm Modal (Nonaktif / Aktif toggle) ----

SIKAP.MasterDataPegawai.openConfirm = function(nip, nama, currentStatus) {
  SIKAP.MasterDataPegawai._toggleTarget = { nip: nip, nama: nama, currentStatus: currentStatus };

  var isDeactivating = currentStatus === 'Aktif';
  var modal = document.getElementById('mdp-confirm-modal');
  var card = document.getElementById('mdp-confirm-card');
  var accent = document.getElementById('mdp-confirm-accent');
  var iconWrap = document.getElementById('mdp-confirm-icon-wrap');
  var icon = document.getElementById('mdp-confirm-icon');
  var actionBtn = document.getElementById('mdp-confirm-action-btn');
  var actionIcon = document.getElementById('mdp-confirm-action-icon');
  var actionText = document.getElementById('mdp-confirm-action-text');

  if (isDeactivating) {
    accent.className = 'absolute top-0 left-0 right-0 h-1 bg-error';
    iconWrap.className = 'w-16 h-16 rounded-full flex items-center justify-center mb-lg bg-error-container';
    icon.textContent = 'warning';
    icon.className = 'material-symbols-outlined text-[32px] text-on-error-container';
    document.getElementById('mdp-confirm-title').textContent = 'Nonaktifkan Akun Pegawai?';
    document.getElementById('mdp-confirm-desc').textContent = 'Pegawai tidak dapat login setelah akun dinonaktifkan.';
    actionBtn.className = 'flex-1 px-lg py-md rounded-lg font-label-md text-center focus:outline-none focus:ring-2 flex items-center justify-center gap-sm transition-colors bg-error text-on-error hover:bg-error/90 focus:ring-error';
    actionIcon.textContent = 'block';
    actionText.textContent = 'Ya, Nonaktifkan';
  } else {
    accent.className = 'absolute top-0 left-0 right-0 h-1 bg-primary';
    iconWrap.className = 'w-16 h-16 rounded-full flex items-center justify-center mb-lg bg-primary-container';
    icon.textContent = 'check_circle';
    icon.className = 'material-symbols-outlined text-[32px] text-on-primary-container';
    document.getElementById('mdp-confirm-title').textContent = 'Aktifkan Kembali Akun?';
    document.getElementById('mdp-confirm-desc').textContent = 'Pegawai dapat login kembali setelah akun diaktifkan.';
    actionBtn.className = 'flex-1 px-lg py-md rounded-lg font-label-md text-center focus:outline-none focus:ring-2 flex items-center justify-center gap-sm transition-colors bg-primary text-on-primary hover:bg-primary/90 focus:ring-primary';
    actionIcon.textContent = 'check_circle';
    actionText.textContent = 'Ya, Aktifkan';
  }

  document.getElementById('mdp-confirm-nama').textContent = nama;
  document.getElementById('mdp-confirm-nip').textContent = 'NIP: ' + nip;

  modal.classList.remove('hidden');
  modal.classList.add('flex');
  setTimeout(function() {
    card.classList.remove('scale-95', 'opacity-0');
    card.classList.add('scale-100', 'opacity-100');
  }, 10);
};

SIKAP.MasterDataPegawai.closeConfirmModal = function() {
  var card = document.getElementById('mdp-confirm-card');
  card.classList.add('scale-95', 'opacity-0');
  card.classList.remove('scale-100', 'opacity-100');
  setTimeout(function() {
    document.getElementById('mdp-confirm-modal').classList.add('hidden');
    document.getElementById('mdp-confirm-modal').classList.remove('flex');
  }, 200);
};

SIKAP.MasterDataPegawai.executeStatusToggle = function() {
  var target = SIKAP.MasterDataPegawai._toggleTarget;
  if (!target) return;
  var newStatus = target.currentStatus === 'Aktif' ? 'Nonaktif' : 'Aktif';
  var actionBtn = document.getElementById('mdp-confirm-action-btn');
  actionBtn.disabled = true;
  document.getElementById('mdp-confirm-action-icon').textContent = 'hourglass_empty';
  document.getElementById('mdp-confirm-action-text').textContent = 'Memproses...';

  SIKAP.Api.call('adminSetStatusAkun', { token: SIKAP.state.token, targetNip: target.nip, newStatus: newStatus })
    .then(function(result) {
      SIKAP.MasterDataPegawai.closeConfirmModal();
      if (result.success) {
        SIKAP.Toast.show(result.message, 'success');
        SIKAP.MasterDataPegawai.load();
      } else {
        SIKAP.Toast.show(result.message, 'error');
        if (result.message.indexOf('Sesi') !== -1) SIKAP.Auth.handleSessionExpired();
      }
    })
    .catch(function() {
      actionBtn.disabled = false;
      SIKAP.Toast.show('Gagal mengubah status. Coba lagi.', 'error');
    });
};
