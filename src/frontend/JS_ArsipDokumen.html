<script>
// ============================================================
// JS_ArsipDokumen.html — Arsip Dokumen Controller
// Handles Categorized Documents (Wajib & Opsional),
// Status Tersedia / Belum diunggah, Preview, Open, Replace, Delete.
// ============================================================

SIKAP.Arsip = SIKAP.Arsip || {};

// State
SIKAP.Arsip.state = {
  docs: [],
  wajibDocs: [],
  opsionalDocs: [],
  selectedFile: null,
  uploadingId: null, // Holds doc ID during upload / replace flow
  deletingArsipId: null, // Holds ID_Arsip during delete confirmation
  deletingDocName: '',
  currentPreviewId: null,
  pendingAction: null // Context passed from the employee dashboard
};

/**
 * Main load function called by Router onViewEnter.
 */
SIKAP.Arsip.load = function() {
  SIKAP.UI.showLoading();
  SIKAP.Api.call('getArsipDokumenPegawai', { token: SIKAP.state.token })
    .then(function(result) {
      if (result.success) {
        SIKAP.Arsip.state.docs = result.data.tableRows || [];
        SIKAP.Arsip.state.wajibDocs = result.data.wajibRows || [];
        SIKAP.Arsip.state.opsionalDocs = result.data.opsionalRows || [];

        SIKAP.Arsip.renderSummary(result.data);
        SIKAP.Arsip.renderCategorizedTables(result.data);
        SIKAP.Arsip.populateUploadSelect(result.data.tableRows || []);
        SIKAP.Arsip.handlePendingAction();
      } else {
        SIKAP.Toast.show(result.message, 'error');
      }
      SIKAP.UI.hideLoading();
    })
    .catch(function(error) {
      SIKAP.Toast.show('Terjadi kesalahan jaringan saat memuat arsip.', 'error');
      SIKAP.UI.hideLoading();
    });
};

/**
 * Opens a contextual document action requested from another view.
 * The action is consumed only after archive data and modal selects are ready.
 */
SIKAP.Arsip.handlePendingAction = function() {
  var pending = SIKAP.Arsip.state.pendingAction;
  if (!pending) return;
  SIKAP.Arsip.state.pendingAction = null;

  var record = (SIKAP.Arsip.state.docs || []).find(function(doc) {
    return String(doc.idDokumen || '') === String(pending.idDokumen || '');
  });
  if (!record) {
    SIKAP.Toast.show('Dokumen yang dipilih tidak ditemukan.', 'warning');
    return;
  }

  if (pending.type === 'rejection' && record.idArsip) {
    SIKAP.Arsip.openPenolakanModal(record.idArsip);
  } else if (pending.type === 'upload') {
    SIKAP.Arsip.openUploadModal(record.idDokumen, !!pending.isReplace);
  } else if (pending.type === 'preview' && record.idArsip) {
    SIKAP.Arsip.openPreviewModal(record.idArsip);
  }
};

// ============================================================
// RENDERERS
// ============================================================

/**
 * Updates the top summary card and progress bar.
 */
SIKAP.Arsip.renderSummary = function(data) {
  var totalDocs = data.totalDocs || 11;
  var availableCount = data.availableCount || 0;
  var wajibTotal = data.wajibTotal || 9;
  var wajibAvailable = data.wajibAvailable || 0;
  var pct = wajibTotal > 0 ? Math.round((wajibAvailable / wajibTotal) * 100) : 0;
  
  // Progress Circle & Text
  var textEl = document.getElementById('arsip-progress-text');
  if (textEl) textEl.textContent = pct + '%';
  
  var badgeEl = document.getElementById('arsip-summary-badge');
  if (badgeEl) badgeEl.textContent = availableCount + ' dari ' + totalDocs + ' dokumen tersedia';

  var descEl = document.getElementById('arsip-progress-desc');
  if (descEl) {
    descEl.innerHTML = '<strong>' + wajibAvailable + ' dari ' + wajibTotal + '</strong> dokumen wajib telah tersedia. ' +
      '<span class="text-on-surface-variant/80 text-xs block mt-1">Dokumen opsional tidak dianggap sebagai missing atau mengurangi kelengkapan.</span>';
  }
  
  // Animate Bar
  var bar = document.getElementById('arsip-progress-bar');
  if (bar) bar.style.width = pct + '%';
  
  // Animate Circle
  var circle = document.getElementById('arsip-progress-circle');
  if (circle) {
    var totalLength = 251.2;
    var offset = totalLength - ((pct / 100) * totalLength);
    circle.style.strokeDashoffset = offset;
  }
  
  // Metric counts
  if (document.getElementById('arsip-count-available')) {
    document.getElementById('arsip-count-available').textContent = availableCount;
  }
  if (document.getElementById('arsip-count-verified')) {
    document.getElementById('arsip-count-verified').textContent = (data.counts && data.counts.terverifikasi) || 0;
  }
  if (document.getElementById('arsip-count-waiting')) {
    document.getElementById('arsip-count-waiting').textContent = (data.counts && data.counts.menunggu) || 0;
  }
  if (document.getElementById('arsip-count-empty')) {
    document.getElementById('arsip-count-empty').textContent = (data.counts && data.counts.belumUnggah) || 0;
  }

  // Section Badges
  if (document.getElementById('arsip-wajib-count-badge')) {
    document.getElementById('arsip-wajib-count-badge').textContent = wajibAvailable + ' / ' + wajibTotal + ' Tersedia';
  }
  if (document.getElementById('arsip-opsional-count-badge')) {
    var opsTotal = (data.opsionalRows && data.opsionalRows.length) || 2;
    var opsAvailable = (data.opsionalRows || []).filter(function(d) { return d.isAvailable; }).length;
    document.getElementById('arsip-opsional-count-badge').textContent = opsAvailable + ' / ' + opsTotal + ' Tersedia';
  }
};

/**
 * Renders both Dokumen Wajib and Dokumen Opsional tables.
 */
SIKAP.Arsip.renderCategorizedTables = function(data) {
  SIKAP.Arsip.renderTableSection('arsip-wajib-tbody', data.wajibRows || [], true);
  SIKAP.Arsip.renderTableSection('arsip-opsional-tbody', data.opsionalRows || [], false);
};

/**
 * Renders a specific table section.
 */
SIKAP.Arsip.renderTableSection = function(tbodyId, rows, isWajib) {
  var tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  
  if (!rows || rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-on-surface-variant font-body-md">Tidak ada dokumen pada kategori ini.</td></tr>';
    return;
  }
  
  var html = '';
  rows.forEach(function(r, index) {
    var isAvailable = r.isAvailable;
    var statusInfo = SIKAP.Arsip.getStatusDisplay(r);
    
    var rowClass = 'hover:bg-surface-container-lowest/80 transition-colors group';
    if (r.status === 'Ditolak') {
      rowClass += ' bg-error-container/15';
    } else if (!isAvailable) {
      rowClass += ' bg-surface-container-lowest opacity-85 hover:opacity-100';
    }
    
    var safeNama = SIKAP.escapeHtml(r.nama);
    var safeIdDoc = SIKAP.escapeHtml(r.idDokumen);
    var safeKategori = SIKAP.escapeHtml(r.kategori || 'Administrasi');
    var safeWaktu = SIKAP.escapeHtml(r.waktuUpload);

    html += '<tr class="' + rowClass + '">';
    
    // Col 1: Icon
    html += '<td class="px-6 py-4">' + statusInfo.iconHtml + '</td>';
    
    // Col 2: Document Name
    html += '<td class="px-6 py-4">';
    html += '<div class="flex flex-col">';
    html += '<span class="font-label-md text-on-surface font-semibold text-sm">' + safeNama + '</span>';
    html += '<span class="font-body-sm text-on-surface-variant text-xs mt-0.5">' + safeIdDoc + '</span>';
    html += '</div>';
    html += '</td>';
    
    // Col 3: Category
    html += '<td class="px-6 py-4">';
    html += '<span class="px-2.5 py-1 bg-surface-container-high text-on-surface-variant text-[11px] font-label-sm rounded-md tracking-wide">' + safeKategori + '</span>';
    html += '</td>';
    
    // Col 4: Status (Tersedia / Belum diunggah)
    html += '<td class="px-6 py-4">' + statusInfo.badgeHtml + '</td>';
    
    // Col 5: Upload Timestamp
    html += '<td class="px-6 py-4">';
    if (r.waktuUpload && r.waktuUpload !== '-') {
      html += '<span class="text-[12px] text-on-surface-variant font-medium">' + safeWaktu + '</span>';
    } else {
      html += '<span class="text-[12px] text-on-surface-variant italic">—</span>';
    }
    html += '</td>';
    
    // Col 6: Actions
    html += '<td class="px-6 py-4 text-right">';
    html += '<div class="flex items-center justify-end gap-1.5">';
    
    if (isAvailable) {
      // 1. Preview Button
      html += '<button onclick="SIKAP.Arsip.openPreviewModal(\'' + SIKAP.escapeHtml(r.idArsip) + '\')" class="p-2 text-on-surface-variant hover:text-primary hover:bg-primary-container/20 rounded-lg transition-colors" title="Lihat Informasi & Preview">';
      html += '<span class="material-symbols-outlined text-[19px]">visibility</span></button>';

      // 2. Open Direct Link Button
      if (r.fileUrl) {
        html += '<a href="' + encodeURI(r.fileUrl) + '" target="_blank" class="p-2 text-on-surface-variant hover:text-primary hover:bg-primary-container/20 rounded-lg transition-colors inline-flex items-center" title="Buka Dokumen di Tab Baru">';
        html += '<span class="material-symbols-outlined text-[19px]">open_in_new</span></a>';
      }

      // 3. Replace / Ganti Dokumen
      html += '<button onclick="SIKAP.Arsip.openUploadModal(\'' + SIKAP.escapeHtml(r.idDokumen) + '\', true)" class="p-2 text-on-surface-variant hover:text-primary hover:bg-primary-container/20 rounded-lg transition-colors" title="Ganti Dokumen">';
      html += '<span class="material-symbols-outlined text-[19px]">sync</span></button>';

      // 4. Delete / Hapus Dokumen
      html += '<button onclick="SIKAP.Arsip.openHapusModal(\'' + SIKAP.escapeHtml(r.idArsip) + '\', \'' + SIKAP.escapeHtml(r.nama).replace(/'/g, '\\\'') + '\')" class="p-2 text-on-surface-variant hover:text-error hover:bg-error-container/20 rounded-lg transition-colors" title="Hapus Dokumen">';
      html += '<span class="material-symbols-outlined text-[19px]">delete</span></button>';

    } else {
      // Missing / Belum diunggah -> Upload Button
      var btnClass = isWajib 
        ? 'bg-primary text-on-primary hover:bg-primary/90 shadow-sm' 
        : 'bg-surface-container-high text-on-surface hover:bg-surface-container-highest border border-outline-variant/30';
      
      html += '<button onclick="SIKAP.Arsip.openUploadModal(\'' + SIKAP.escapeHtml(r.idDokumen) + '\')" class="px-3 py-1.5 ' + btnClass + ' rounded-lg font-label-sm text-xs transition-all flex items-center gap-1.5 active:scale-95">';
      html += '<span class="material-symbols-outlined text-[16px]">cloud_upload</span>';
      html += 'Upload</button>';
    }
    
    html += '</div></td></tr>';
  });
  
  tbody.innerHTML = html;
};

/**
 * Formats status display (Tersedia vs Belum diunggah with verification pills).
 */
SIKAP.Arsip.getStatusDisplay = function(doc) {
  var iconHtml = '';
  var badgeHtml = '';
  
  if (doc.isAvailable) {
    iconHtml = '<div class="w-9 h-9 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center shrink-0 border border-emerald-200/60"><span class="material-symbols-outlined text-[20px]">check_circle</span></div>';
    
    // Base badge: Tersedia
    badgeHtml = '<div class="flex flex-col gap-1 items-start">';
    badgeHtml += '<div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-label-sm text-[11px] font-semibold">';
    badgeHtml += '<span class="material-symbols-outlined text-[13px]">check</span> Tersedia</div>';
    
    // Sub-verification pill if pending or rejected
    if (doc.status === 'Menunggu') {
      badgeHtml += '<span class="inline-flex items-center gap-1 text-[10px] text-[#b06000] font-medium bg-[#fef7e0] px-2 py-0.5 rounded border border-[#ffe0b2]">';
      badgeHtml += '<span class="material-symbols-outlined text-[11px]">pending</span> Menunggu Verifikasi</span>';
    } else if (doc.status === 'Ditolak') {
      badgeHtml += '<span class="inline-flex items-center gap-1 text-[10px] text-error font-medium bg-error-container/30 px-2 py-0.5 rounded border border-error-container cursor-pointer" onclick="SIKAP.Arsip.openPenolakanModal(\'' + doc.idArsip + '\')">';
      badgeHtml += '<span class="material-symbols-outlined text-[11px]">warning</span> Perlu Revisi</span>';
    }
    badgeHtml += '</div>';

  } else {
    iconHtml = '<div class="w-9 h-9 rounded-lg bg-surface-container text-on-surface-variant flex items-center justify-center shrink-0 border border-dashed border-outline-variant/50"><span class="material-symbols-outlined text-[18px] opacity-60">hourglass_empty</span></div>';
    badgeHtml = '<div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-surface-variant/80 text-on-surface-variant font-label-sm text-[11px]">';
    badgeHtml += '<span class="material-symbols-outlined text-[13px]">remove</span> Belum diunggah</div>';
  }
  
  return { iconHtml: iconHtml, badgeHtml: badgeHtml };
};

// ============================================================
// UPLOAD / GANTI MODAL LOGIC
// ============================================================

/**
 * Fills the document type dropdown in upload modal.
 */
SIKAP.Arsip.populateUploadSelect = function(docs) {
  var sel = document.getElementById('arsip-upload-select');
  if (!sel) return;
  
  sel.innerHTML = '<option value="" disabled selected>Pilih jenis dokumen...</option>';
  
  docs.forEach(function(d) {
    var text = d.nama;
    if (d.wajib === 'Ya') text += ' (Wajib)';
    else text += ' (Opsional)';
    
    if (d.isAvailable) text += ' — [Sudah Ada / Ganti]';
    if (d.status === 'Ditolak') text += ' — [Perlu Revisi]';
    
    sel.innerHTML += '<option value="' + SIKAP.escapeHtml(d.idDokumen) + '">' + SIKAP.escapeHtml(text) + '</option>';
  });
};

SIKAP.Arsip.openUploadModal = function(preselectId, isReplace) {
  document.getElementById('modal-upload-dokumen').classList.remove('hidden');
  SIKAP.Arsip.clearSelectedFile();
  
  var titleEl = document.getElementById('modal-upload-title');
  var btnTextEl = document.getElementById('upload-btn-text');
  if (isReplace) {
    if (titleEl) titleEl.textContent = 'Ganti Dokumen';
    if (btnTextEl) btnTextEl.textContent = 'Ganti Dokumen';
  } else {
    if (titleEl) titleEl.textContent = 'Unggah Dokumen Baru';
    if (btnTextEl) btnTextEl.textContent = 'Unggah Dokumen';
  }

  var sel = document.getElementById('arsip-upload-select');
  if (preselectId && sel) {
    sel.value = preselectId;
    sel.disabled = true; // Lock selection
    SIKAP.Arsip.state.uploadingId = preselectId;
  } else {
    if (sel) {
      sel.value = '';
      sel.disabled = false;
    }
    SIKAP.Arsip.state.uploadingId = null;
  }
  SIKAP.Arsip.updateUploadBtnState();
};

SIKAP.Arsip.closeUploadModal = function() {
  document.getElementById('modal-upload-dokumen').classList.add('hidden');
  SIKAP.Arsip.clearSelectedFile();
};

// File Selection Handler
document.addEventListener('DOMContentLoaded', function() {
  var fileInput = document.getElementById('arsip-upload-file');
  if (fileInput) {
    fileInput.addEventListener('change', function() {
      if (this.files && this.files[0]) {
        SIKAP.Arsip.handleFileSelect(this.files[0]);
      }
    });
  }
  
  var sel = document.getElementById('arsip-upload-select');
  if (sel) {
    sel.addEventListener('change', function() {
      SIKAP.Arsip.state.uploadingId = this.value;
      SIKAP.Arsip.updateUploadBtnState();
    });
  }
});

SIKAP.Arsip.handleFileSelect = function(file) {
  if (file.size > 5 * 1024 * 1024) {
    SIKAP.Toast.show('Ukuran file melebihi batas maksimal 5 MB.', 'error');
    return;
  }
  
  var allowedTypes = ['application/pdf', 'image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/jfif', 'image/pjpeg'];
  var ext = (file.name || '').split('.').pop().toLowerCase();
  var isAllowedExt = ['pdf', 'jpg', 'jpeg', 'png', 'webp', 'jfif'].indexOf(ext) !== -1;
  
  if (allowedTypes.indexOf(file.type) === -1 && !isAllowedExt) {
    SIKAP.Toast.show('Format file tidak didukung. Gunakan PDF, JPG, atau PNG.', 'error');
    return;
  }
  
  SIKAP.Arsip.state.selectedFile = file;
  
  document.getElementById('arsip-upload-dropzone').classList.add('hidden');
  document.getElementById('arsip-upload-selected').classList.remove('hidden');
  document.getElementById('arsip-upload-filename').textContent = file.name;
  
  var mb = (file.size / (1024 * 1024)).toFixed(2);
  document.getElementById('arsip-upload-filesize').textContent = mb + ' MB';
  
  var icon = 'description';
  if (file.type.indexOf('pdf') !== -1 || ext === 'pdf') icon = 'picture_as_pdf';
  else if (file.type.indexOf('image') !== -1 || ['jpg', 'jpeg', 'png'].indexOf(ext) !== -1) icon = 'image';
  document.getElementById('arsip-upload-icon').textContent = icon;
  
  SIKAP.Arsip.updateUploadBtnState();
};

SIKAP.Arsip.clearSelectedFile = function() {
  SIKAP.Arsip.state.selectedFile = null;
  var input = document.getElementById('arsip-upload-file');
  if (input) input.value = '';
  
  var dropzone = document.getElementById('arsip-upload-dropzone');
  var selected = document.getElementById('arsip-upload-selected');
  if (dropzone) dropzone.classList.remove('hidden');
  if (selected) selected.classList.add('hidden');
  
  SIKAP.Arsip.updateUploadBtnState();
};

SIKAP.Arsip.updateUploadBtnState = function() {
  var btn = document.getElementById('arsip-btn-upload');
  if (!btn) return;
  
  if (SIKAP.Arsip.state.selectedFile && SIKAP.Arsip.state.uploadingId) {
    btn.disabled = false;
  } else {
    btn.disabled = true;
  }
};

SIKAP.Arsip.submitUpload = function() {
  var file = SIKAP.Arsip.state.selectedFile;
  var docId = SIKAP.Arsip.state.uploadingId;
  
  if (!file || !docId) return;
  
  var btn = document.getElementById('arsip-btn-upload');
  var progress = document.getElementById('arsip-upload-progress-container');
  var removeBtn = document.getElementById('arsip-upload-remove');
  var closeBtn = document.getElementById('btn-close-upload');
  var cancelBtn = document.getElementById('btn-cancel-upload');
  var select = document.getElementById('arsip-upload-select');
  
  if (btn) btn.disabled = true;
  if (removeBtn) removeBtn.disabled = true;
  if (closeBtn) closeBtn.disabled = true;
  if (cancelBtn) cancelBtn.disabled = true;
  if (select) select.disabled = true;
  
  document.getElementById('upload-btn-text').textContent = 'Mengunggah...';
  document.getElementById('upload-btn-icon').textContent = 'sync';
  document.getElementById('upload-btn-icon').classList.add('animate-spin');
  if (progress) progress.classList.remove('hidden');
  
  SIKAP.UI.showLoading();
  
  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    var base64Data = dataUrl.split(',')[1];
    var mimeType = file.type || '';
    if (!mimeType) {
      var n = (file.name || '').toLowerCase();
      if (n.indexOf('.pdf') !== -1) mimeType = 'application/pdf';
      else if (n.indexOf('.png') !== -1) mimeType = 'image/png';
      else mimeType = 'image/jpeg';
    }
    
    SIKAP.Api.call('uploadDokumen', { token: SIKAP.state.token, idDokumen: docId, base64Data: base64Data, mimeType: mimeType })
      .then(function(res) {
        SIKAP.UI.hideLoading();
        if (res.success) {
          SIKAP.Toast.show(res.message, 'success');
          if (SIKAP.DashboardPegawai && SIKAP.DashboardPegawai.invalidate) {
            SIKAP.DashboardPegawai.invalidate();
          }
          SIKAP.Arsip.closeUploadModal();
          SIKAP.Arsip.load(); 
        } else {
          SIKAP.Toast.show(res.message, 'error');
          SIKAP.Arsip.resetUploadUIState();
        }
      })
      .catch(function(err) {
        SIKAP.UI.hideLoading();
        SIKAP.Toast.show('Terjadi kesalahan jaringan saat mengunggah.', 'error');
        SIKAP.Arsip.resetUploadUIState();
      });
  };
  
  reader.onerror = function() {
    SIKAP.UI.hideLoading();
    SIKAP.Toast.show('Gagal membaca file lokal.', 'error');
    SIKAP.Arsip.resetUploadUIState();
  };
  
  reader.readAsDataURL(file);
};

SIKAP.Arsip.resetUploadUIState = function() {
  var btn = document.getElementById('arsip-btn-upload');
  var progress = document.getElementById('arsip-upload-progress-container');
  var removeBtn = document.getElementById('arsip-upload-remove');
  var closeBtn = document.getElementById('btn-close-upload');
  var cancelBtn = document.getElementById('btn-cancel-upload');
  
  if (btn) btn.disabled = false;
  if (removeBtn) removeBtn.disabled = false;
  if (closeBtn) closeBtn.disabled = false;
  if (cancelBtn) cancelBtn.disabled = false;
  
  document.getElementById('upload-btn-text').textContent = 'Unggah Dokumen';
  document.getElementById('upload-btn-icon').textContent = 'upload';
  document.getElementById('upload-btn-icon').classList.remove('animate-spin');
  if (progress) progress.classList.add('hidden');
};

// ============================================================
// PREVIEW MODAL LOGIC
// ============================================================

SIKAP.Arsip.openPreviewModal = function(idArsip) {
  SIKAP.Arsip.state.currentPreviewId = idArsip;
  document.getElementById('modal-preview-dokumen').classList.remove('hidden');
  document.getElementById('preview-loader').classList.remove('hidden');
  
  document.getElementById('preview-nama-dokumen').textContent = 'Memuat Dokumen...';
  document.getElementById('preview-info-nama').textContent = 'Memuat...';
  document.getElementById('preview-info-kategori').textContent = 'Memuat...';
  document.getElementById('preview-waktu-upload').textContent = '-';
  document.getElementById('preview-status-text').textContent = 'TERSEDIA';
  document.getElementById('preview-waktu-verifikasi').textContent = '';
  document.getElementById('preview-catatan-container').classList.add('hidden');
  document.getElementById('preview-iframe').src = 'about:blank';
  
  SIKAP.Api.call('getDokumenPreview', { token: SIKAP.state.token, idArsip: idArsip })
    .then(function(res) {
      if (res.success) {
        var d = res.data;
        document.getElementById('preview-nama-dokumen').textContent = d.namaDokumen;
        document.getElementById('preview-info-nama').textContent = d.namaDokumen;
        document.getElementById('preview-info-kategori').textContent = d.idDokumen;
        document.getElementById('preview-waktu-upload').textContent = d.waktuUpload;
        
        document.getElementById('preview-iframe').src = d.previewUrl;
        document.getElementById('preview-btn-download').href = d.downloadUrl;
        document.getElementById('preview-btn-newtab').href = d.previewUrl;
        
        var badge = document.getElementById('preview-status-badge');
        var text = document.getElementById('preview-status-text');
        var icon = document.getElementById('preview-status-icon');
        
        badge.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full';
        text.textContent = 'TERSEDIA (' + (d.statusVerifikasi || 'Aktif').toUpperCase() + ')';
        
        if (d.statusVerifikasi === 'Terverifikasi') {
          badge.classList.add('bg-[#dcfce7]', 'text-[#166534]');
          icon.textContent = 'check_circle';
        } else if (d.statusVerifikasi === 'Menunggu') {
          badge.classList.add('bg-[#fef7e0]', 'text-[#b06000]');
          icon.textContent = 'pending';
        } else if (d.statusVerifikasi === 'Ditolak') {
          badge.classList.add('bg-error-container', 'text-on-error-container');
          icon.textContent = 'error';
        } else {
          badge.classList.add('bg-emerald-100', 'text-emerald-800');
          icon.textContent = 'check_circle';
        }
        
        if (d.statusVerifikasi && d.statusVerifikasi !== 'Menunggu') {
          document.getElementById('preview-waktu-verifikasi').textContent = 'Diverifikasi oleh ' + (d.namaVerifier || 'Admin') + ' pada ' + d.waktuVerifikasi;
        }
        
        if (d.catatanAdmin && d.catatanAdmin.trim() !== '') {
          document.getElementById('preview-catatan-container').classList.remove('hidden');
          document.getElementById('preview-catatan-admin').textContent = d.catatanAdmin;
        }
      } else {
        SIKAP.Toast.show(res.message, 'error');
        SIKAP.Arsip.closePreviewModal();
        SIKAP.Arsip.load();
      }
    })
    .catch(function() {
      SIKAP.Toast.show('Terjadi kesalahan jaringan saat memuat preview.', 'error');
      SIKAP.Arsip.closePreviewModal();
    });
};

SIKAP.Arsip.closePreviewModal = function() {
  document.getElementById('modal-preview-dokumen').classList.add('hidden');
  document.getElementById('preview-iframe').src = 'about:blank';
  SIKAP.Arsip.state.currentPreviewId = null;
};

SIKAP.Arsip.replaceFromPreview = function() {
  var idArsip = SIKAP.Arsip.state.currentPreviewId;
  var doc = (SIKAP.Arsip.state.docs || []).find(function(d) { return d.idArsip === idArsip; });
  SIKAP.Arsip.closePreviewModal();
  if (doc) {
    SIKAP.Arsip.openUploadModal(doc.idDokumen, true);
  }
};

SIKAP.Arsip.deleteFromPreview = function() {
  var idArsip = SIKAP.Arsip.state.currentPreviewId;
  var doc = (SIKAP.Arsip.state.docs || []).find(function(d) { return d.idArsip === idArsip; });
  SIKAP.Arsip.closePreviewModal();
  if (doc) {
    SIKAP.Arsip.openHapusModal(idArsip, doc.nama);
  }
};

// ============================================================
// DELETE CONFIRMATION MODAL LOGIC
// ============================================================

SIKAP.Arsip.openHapusModal = function(idArsip, namaDokumen) {
  SIKAP.Arsip.state.deletingArsipId = idArsip;
  SIKAP.Arsip.state.deletingDocName = namaDokumen;
  
  var descEl = document.getElementById('hapus-modal-desc');
  if (descEl) {
    descEl.textContent = 'Apakah Anda yakin ingin menghapus arsip dokumen "' + namaDokumen + '"? File fisik di Google Drive akan dipindahkan ke tempat sampah dan status dokumen berubah menjadi "Belum diunggah".';
  }
  
  document.getElementById('modal-konfirmasi-hapus').classList.remove('hidden');
};

SIKAP.Arsip.closeHapusModal = function() {
  document.getElementById('modal-konfirmasi-hapus').classList.add('hidden');
  SIKAP.Arsip.state.deletingArsipId = null;
  SIKAP.Arsip.state.deletingDocName = '';
};

SIKAP.Arsip.confirmDelete = function() {
  var idArsip = SIKAP.Arsip.state.deletingArsipId;
  if (!idArsip) return;
  
  var btn = document.getElementById('btn-confirm-delete');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">sync</span> Menghapus...';
  }
  
  SIKAP.UI.showLoading();
  
  SIKAP.Api.call('hapusDokumen', { token: SIKAP.state.token, idArsip: idArsip })
    .then(function(res) {
      SIKAP.UI.hideLoading();
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">delete</span> Hapus Dokumen';
      }
      SIKAP.Arsip.closeHapusModal();
      
      if (res.success) {
        SIKAP.Toast.show(res.message, 'success');
        if (SIKAP.DashboardPegawai && SIKAP.DashboardPegawai.invalidate) {
          SIKAP.DashboardPegawai.invalidate();
        }
        SIKAP.Arsip.load();
      } else {
        SIKAP.Toast.show(res.message, 'error');
      }
    })
    .catch(function(err) {
      SIKAP.UI.hideLoading();
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">delete</span> Hapus Dokumen';
      }
      SIKAP.Arsip.closeHapusModal();
      SIKAP.Toast.show('Terjadi kesalahan jaringan saat menghapus dokumen.', 'error');
    });
};

// ============================================================
// PENOLAKAN MODAL LOGIC
// ============================================================

SIKAP.Arsip.openPenolakanModal = function(idArsip) {
  document.getElementById('modal-detail-penolakan').classList.remove('hidden');
  var record = SIKAP.Arsip.state.docs.find(function(d) { return d.idArsip === idArsip; });
  if (!record) return;
  
  document.getElementById('penolakan-nama-dokumen').textContent = record.nama;
  document.getElementById('penolakan-catatan-admin').textContent = record.catatan || 'Dokumen belum memenuhi ketentuan verifikasi.';
  SIKAP.Arsip.state.uploadingId = record.idDokumen;
};

SIKAP.Arsip.closePenolakanModal = function() {
  document.getElementById('modal-detail-penolakan').classList.add('hidden');
};

SIKAP.Arsip.reuploadFromPenolakan = function() {
  SIKAP.Arsip.closePenolakanModal();
  SIKAP.Arsip.openUploadModal(SIKAP.Arsip.state.uploadingId, true);
};

</script>
