<!-- ============================================================ -->
<!-- Component_Header.html — Shared Header Bar (App Chrome)      -->
<!-- Tinted surface + navy accent bar, distinct from page/sidebar -->
<!-- ============================================================ -->

<header class="fixed top-0 left-0 right-0 h-[66px] bg-gradient-to-r from-[#dbeafe] via-[#eff6ff] to-[#f0f5ff] backdrop-blur-md shadow-md border-b border-primary/20 z-[60] px-4 lg:px-container-margin flex items-center justify-between">
  <!-- Left: Logo + Title -->
  <div class="flex items-center gap-3.5 min-w-0">
    <!-- Mobile Hamburger -->
    <button class="lg:hidden w-9 h-9 flex items-center justify-center text-on-surface-variant hover:bg-primary/10 hover:text-primary rounded-lg transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40" onclick="SIKAP.UI.toggleSidebar()" aria-label="Toggle menu">
      <span class="material-symbols-outlined text-[20px]">menu</span>
    </button>
    
    <!-- Logo -->
    <img alt="Logo Pemprov NTT" class="h-9 w-auto object-contain hidden sm:block drop-shadow-md" src="https://raw.githubusercontent.com/ElwinMusadi/app-assets/main/logo-ntt.png">
    
    <!-- Title Hierarchy -->
    <div class="flex flex-col justify-center min-w-0">
      <h1 class="flex items-center gap-2 leading-tight">
        <span class="font-h3 text-primary text-[15px] sm:text-[17px] font-extrabold tracking-tight">SIKAP</span>
        <span class="hidden sm:block w-1.5 h-1.5 rounded-full bg-primary/50"></span>
        <span class="font-label-sm text-on-surface-variant/90 text-[11px] sm:text-[13px] font-semibold hidden sm:block whitespace-nowrap">Sistem Informasi Kepegawaian dan Arsip Pegawai</span>
      </h1>
      <span class="font-body-sm text-on-surface-variant text-[10px] sm:text-[11px] uppercase tracking-[0.215em] font-medium leading-tight -mt-0.5">
        UPTD Pendapatan Daerah Wilayah Kota Kupang
      </span>
    </div>
  </div>

  <!-- Right: Actions + Profile -->
  <div class="flex items-center gap-3 sm:gap-4 shrink-0">
    
    <!-- Settings Icon -->
    <button class="w-9 h-9 hidden sm:flex items-center justify-center text-on-surface-variant hover:bg-primary/10 hover:text-primary rounded-full transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40" aria-label="Pengaturan" onclick="SIKAP.Router.navigate('view-pengaturan')">
      <span class="material-symbols-outlined text-[20px]">settings</span>
    </button>
    
    <!-- Divider -->
    <div class="h-6 w-px bg-primary/15 hidden sm:block"></div>
    
    <!-- User Dropdown -->
    <div class="relative flex items-center" id="header-profile-dropdown">
      <button class="w-9 h-9 rounded-full bg-primary hover:bg-primary/90 text-on-primary font-label-md flex items-center justify-center shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary/40 active:scale-95 cursor-pointer overflow-hidden ring-2 ring-white/80" onclick="SIKAP.UI.toggleProfileDropdown()" aria-label="Profil Pengguna" title="Menu Profil">
        <img id="header-avatar-img" class="w-full h-full object-cover hidden" alt="Foto Profil" src="" />
        <span id="header-avatar-initials" class="user-initials font-bold text-[14px]">U</span>
      </button>
      
      <!-- Dropdown Menu -->
      <div id="profile-dropdown-menu" class="hidden absolute right-0 top-full mt-2 w-56 bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 overflow-hidden z-50">
        <div class="px-4 py-3 border-b border-outline-variant/20 bg-surface-container-low/30">
          <p class="font-label-md text-on-surface truncate" id="header-user-name">—</p>
          <p class="font-body-sm text-on-surface-variant text-[11px]" id="header-user-role-text">—</p>
        </div>
        <div class="py-1">
          <button class="w-full px-4 py-2.5 text-left font-body-md text-on-surface hover:bg-surface-container-high transition-colors flex items-center gap-3" onclick="SIKAP.Router.navigate('view-pengaturan'); SIKAP.UI.toggleProfileDropdown();">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">settings</span>
            <span class="text-sm">Pengaturan</span>
          </button>
          <button class="w-full px-4 py-2.5 text-left font-body-md text-error hover:bg-error-container transition-colors flex items-center gap-3 cursor-pointer" onclick="SIKAP.UI.toggleProfileDropdown(); SIKAP.Auth.openLogoutModal();">
            <span class="material-symbols-outlined text-[18px]">logout</span>
            <span class="text-sm">Keluar</span>
          </button>
        </div>
      </div>
    </div>
    
  </div>
</header>

<script>
  SIKAP.UI = SIKAP.UI || {};

  // Profile dropdown toggle
  SIKAP.UI.toggleProfileDropdown = function() {
    var menu = document.getElementById('profile-dropdown-menu');
    if (menu) menu.classList.toggle('hidden');
  };

  // Close dropdown when clicking outside
  document.addEventListener('click', function(e) {
    var dropdown = document.getElementById('header-profile-dropdown');
    var menu = document.getElementById('profile-dropdown-menu');
    if (dropdown && menu && !dropdown.contains(e.target)) {
      menu.classList.add('hidden');
    }
  });
</script>
