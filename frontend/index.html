<!DOCTYPE html>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Global Namespace Init -->
  <script>var SIKAP = window.SIKAP || {};</script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-background font-body-md text-on-surface h-full">

  <!-- ============================================ -->
  <!-- FULL-PAGE INITIAL LOADING SCREEN             -->
  <!-- ============================================ -->
  <div id="app-loading" class="fixed inset-0 bg-background z-[200] flex flex-col items-center justify-center gap-4 transition-opacity duration-300">
    <svg class="animate-spin h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
    </svg>
    <p class="font-label-md text-on-surface-variant">Memuat SIKAP...</p>
  </div>

  <!-- ============================================ -->
  <!-- LOGIN VIEW (No shell — standalone)           -->
  <!-- ============================================ -->
  <div id="view-login" class="hidden h-full">
    <load src="./View_Login.html" />
  </div>

  <!-- ============================================ -->
  <!-- FORCE CHANGE PASSWORD VIEW (standalone)      -->
  <!-- ============================================ -->
  <div id="view-force-change-password" class="hidden h-full">
    <load src="./View_ForceChangePassword.html" />
  </div>

  <!-- ============================================ -->
  <!-- APP SHELL (Header + Sidebar + Content)       -->
  <!-- ============================================ -->
  <div id="app-shell" class="hidden">
    <!-- Header -->
    <load src="./Component_Header.html" />

    <!-- Sidebar -->
    <load src="./Component_Sidebar.html" />

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 hidden lg:hidden" onclick="SIKAP.UI.toggleSidebar()"></div>

    <!-- Main Content Area -->
    <div class="lg:pl-72 pt-16 min-h-screen transition-all duration-300">
      <main class="relative">
        <!-- Dashboard Admin -->
        <div id="view-dashboard-admin" class="hidden view-container">
          <load src="./View_DashboardAdmin.html" />
        </div>

        <!-- Dashboard Pegawai -->
        <div id="view-dashboard-pegawai" class="hidden view-container">
          <load src="./View_DashboardPegawai.html" />
        </div>

        <!-- Profil Pegawai -->
        <div id="view-profil-pegawai" class="hidden view-container">
          <load src="./View_ProfilPegawai.html" />
        </div>

        <!-- Arsip Dokumen -->
        <div id="view-arsip-dokumen" class="hidden view-container">
          <load src="./View_ArsipDokumen.html" />
        </div>

        <!-- Master Data Pegawai -->
        <div id="view-master-data-pegawai" class="hidden view-container">
          <load src="./View_MasterDataPegawai.html" />
        </div>

        <!-- Verifikasi Dokumen -->
        <div id="view-verifikasi-dokumen" class="hidden view-container">
          <load src="./View_VerifikasiDokumen.html" />
        </div>

        <!-- Pengaturan -->
        <div id="view-pengaturan" class="hidden view-container">
          <load src="./View_Pengaturan.html" />
        </div>
      </main>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- GLOBAL COMPONENTS                            -->
  <!-- ============================================ -->
  <load src="./Component_Toast.html" />
  <load src="./Component_Loading.html" />
  <load src="./Component_LogoutModal.html" />

  <!-- ============================================ -->
  <!-- SCRIPTS                                      -->
  <!-- ============================================ -->
  <script type="module" src="./js/JS_App.js"></script>
  <script type="module" src="./js/JS_Router.js"></script>
  <script type="module" src="./js/JS_Auth.js"></script>
  <script type="module" src="./js/JS_ArsipDokumen.js"></script>
  <script type="module" src="./js/JS_DashboardAdmin.js"></script>
  <script type="module" src="./js/JS_MasterDataPegawai.js"></script>
  <script type="module" src="./js/JS_VerifikasiDokumen.js"></script>
  <script type="module" src="./js/JS_Pengaturan.js"></script>

</body>
</html>
