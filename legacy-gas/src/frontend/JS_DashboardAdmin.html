<script>
// ============================================================
// JS_DashboardAdmin.html — Admin Dashboard Controller
// ============================================================

SIKAP.DashboardAdmin = SIKAP.DashboardAdmin || {};

/**
 * Main load function called by Router onViewEnter.
 */
SIKAP.DashboardAdmin.load = function() {
  var token = SIKAP.state.token;
  if (!token) return;

  SIKAP.UI.showLoading();

  SIKAP.Api.call('adminGetDashboardStats', { token: token })
    .then(function(res) {
      SIKAP.UI.hideLoading();
      if (res.success) {
        SIKAP.DashboardAdmin.renderStats(res.data);
      } else {
        SIKAP.Toast.show(res.message, 'error');
      }
    })
    .catch(function(err) {
      SIKAP.UI.hideLoading();
      SIKAP.Toast.show('Gagal memuat statistik dashboard.', 'error');
    });
};

/**
 * Renders statistical counters and recent activities.
 */
SIKAP.DashboardAdmin.renderStats = function(d) {
  // Counters
  document.getElementById('admin-stat-total').textContent = d.totalPegawai || '0';
  document.getElementById('admin-stat-pns').textContent = d.pns || '0';
  document.getElementById('admin-stat-pending').textContent = d.pendingVerifikasi || '0';
  
  // Status Breakdown
  document.getElementById('admin-status-pns').textContent = d.pns || '0';
  document.getElementById('admin-status-cpns').textContent = d.cpns || '0';
  document.getElementById('admin-status-p3k').textContent = d.p3k || '0';

  // Completeness %
  var pct = d.docPct || 0;
  document.getElementById('admin-completeness-pct').textContent = pct + '%';
  
  var verifiedBar = document.getElementById('admin-bar-verified');
  var pendingBar = document.getElementById('admin-bar-pending');
  if (verifiedBar) verifiedBar.style.width = pct + '%';
  if (pendingBar) pendingBar.style.width = (100 - pct) + '%';
  
  // Styling for Menunggu Verifikasi KPI
  var pendingVal = parseInt(d.pendingVerifikasi) || 0;
  var pendingCard = document.getElementById('admin-kpi-verifikasi-card');
  var pendingLabel = document.getElementById('admin-kpi-verifikasi-label');
  var pendingIconContainer = document.getElementById('admin-kpi-verifikasi-icon-container');
  var attentionContainer = document.getElementById('admin-attention-container');

  if (pendingVal > 0) {
    if (pendingCard) pendingCard.classList.add('bg-amber-50', 'border-amber-200');
    if (pendingLabel) pendingLabel.classList.replace('text-on-surface-variant', 'text-amber-800');
    if (pendingIconContainer) pendingIconContainer.classList.replace('bg-surface-container', 'bg-amber-500/20');
    if (pendingIconContainer) pendingIconContainer.classList.replace('text-on-surface-variant', 'text-amber-700');
    
    // Fill Perlu Perhatian
    if (attentionContainer) {
      attentionContainer.innerHTML = 
        '<div class="flex flex-col p-4 bg-amber-50 border border-amber-200 rounded-lg shadow-sm">' +
          '<div class="flex items-start gap-3 mb-4">' +
            '<span class="material-symbols-outlined text-[20px] text-amber-600 mt-0.5">pending_actions</span>' +
            '<div>' +
              '<span class="text-[14px] font-bold text-amber-900 block leading-tight mb-1">' + pendingVal + ' Dokumen menunggu verifikasi</span>' +
              '<span class="text-[12px] text-amber-700 block leading-snug">Pemeriksaan diperlukan agar pegawai dapat melihat status dokumennya.</span>' +
            '</div>' +
          '</div>' +
          '<button class="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white rounded text-[13px] font-semibold transition-colors flex items-center justify-center gap-2" onclick="SIKAP.Router.navigate(\'view-verifikasi-dokumen\')">' +
            'Periksa Sekarang <span class="material-symbols-outlined text-[16px]">arrow_forward</span>' +
          '</button>' +
        '</div>';
    }
  } else {
    // Fill Perlu Perhatian with positive state
    if (attentionContainer) {
      attentionContainer.innerHTML = 
        '<div class="flex items-start gap-3 p-4 bg-emerald-50 text-emerald-800 rounded-lg border border-emerald-100">' +
          '<span class="material-symbols-outlined text-[20px] text-emerald-600">check_circle</span>' +
          '<span class="text-[13px] font-medium leading-tight pt-0.5">Tidak ada item yang membutuhkan perhatian saat ini.</span>' +
        '</div>';
    }
  }

  // Activity Timeline — uses same visual style as LogAktivitas page
  var feedContainer = document.getElementById('admin-activity-feed');
  var summaryEl = document.getElementById('admin-activity-summary');
  if (!feedContainer) return;

  if (!d.recentActivities || d.recentActivities.length === 0) {
    feedContainer.innerHTML =
      '<li class="px-5 py-10 sm:px-6 text-center">' +
        '<div class="flex h-12 w-12 items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant mx-auto mb-3">' +
          '<span class="material-symbols-outlined text-[24px]" aria-hidden="true">history</span>' +
        '</div>' +
        '<p class="text-body-md text-on-surface-variant">Belum ada aktivitas terbaru.</p>' +
      '</li>';
    if (summaryEl) summaryEl.textContent = 'Belum ada data aktivitas.';
    return;
  }

  var acts = d.recentActivities.slice(0, 7);
  if (summaryEl) summaryEl.textContent = 'Menampilkan ' + acts.length + ' aktivitas terakhir.';

  var html = '';
  acts.forEach(function(act) {
    var meta = SIKAP.DashboardAdmin._getActivityMeta(act);
    var resultMeta = SIKAP.DashboardAdmin._getResultMeta(act.result);

    html += '<li class="group px-5 py-4 transition-colors hover:bg-surface-container-low/60 sm:px-6">';
    html +=   '<article class="flex items-start gap-3.5">';

    // Icon
    html +=     '<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl ' + meta.iconClass + '">';
    html +=       '<span class="material-symbols-outlined text-[21px]" aria-hidden="true">' + meta.icon + '</span>';
    html +=     '</div>';

    // Content
    html +=     '<div class="min-w-0 flex-1">';

    // Title row
    html +=       '<div class="flex flex-col gap-1.5 sm:flex-row sm:items-start sm:justify-between">';
    html +=         '<div class="flex min-w-0 flex-wrap items-center gap-2">';
    html +=           '<h3 class="text-label-md text-on-surface">' + meta.title + '</h3>';
    html +=           '<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-[11px] font-semibold ring-1 ring-inset ' + resultMeta.className + '">' + resultMeta.label + '</span>';
    html +=         '</div>';
    html +=         '<time class="shrink-0 text-body-sm font-medium text-on-surface-variant">' + act.time + '</time>';
    html +=       '</div>';

    // Description
    html +=       '<p class="mt-1.5 break-words text-body-sm leading-relaxed text-on-surface-variant">' + act.description + '</p>';

    // Metadata chips
    html +=       '<div class="mt-2.5 flex flex-wrap items-center gap-x-2.5 gap-y-1.5 text-body-sm text-on-surface-variant">';
    if (act.actorName || act.actorNip) {
      html +=       '<span class="inline-flex items-center gap-1.5 rounded-lg bg-surface-container-high px-2 py-0.5">';
      html +=         '<span class="material-symbols-outlined text-[14px]" aria-hidden="true">person</span>';
      html +=         '<span>' + (act.actorName || act.actorNip) + (act.actorRole ? ' · ' + act.actorRole : '') + '</span>';
      html +=       '</span>';
    }
    if (act.action) {
      html +=       '<code class="rounded-md bg-surface-container-low px-2 py-0.5 font-mono text-[11px] text-on-surface-variant">' + act.action + '</code>';
    }
    if (act.targetId) {
      html +=       '<span class="inline-flex min-w-0 items-center gap-1">';
      html +=         '<span class="material-symbols-outlined text-[14px]" aria-hidden="true">flag</span>';
      html +=         '<span class="break-all text-[11px]">' + act.targetId + '</span>';
      html +=       '</span>';
    }
    html +=       '</div>';

    html +=     '</div>';
    html +=   '</article>';
    html += '</li>';
  });

  feedContainer.innerHTML = html;
};

// ---- Activity meta helpers (mirrors LogAktivitas.getActivityMeta) ----
SIKAP.DashboardAdmin._getActivityMeta = function(act) {
  var action = (act.action || '').toUpperCase();
  var desc = (act.description || '').toLowerCase();

  if (action.indexOf('DOKUMEN_APPROVE') !== -1 || desc.indexOf('disetujui') !== -1) {
    return { title: 'Dokumen disetujui', icon: 'verified', iconClass: 'bg-emerald-100 text-emerald-700' };
  }
  if (action.indexOf('DOKUMEN_REJECT') !== -1 || desc.indexOf('ditolak') !== -1 || desc.indexOf('revisi') !== -1) {
    return { title: 'Dokumen perlu revisi', icon: 'rate_review', iconClass: 'bg-orange-100 text-orange-700' };
  }
  if (action.indexOf('FOTO_PROFIL_UPLOAD') !== -1) {
    return { title: 'Foto profil diperbarui', icon: 'add_a_photo', iconClass: 'bg-purple-100 text-purple-700' };
  }
  if (action.indexOf('DOKUMEN') !== -1 || action.indexOf('UPLOAD') !== -1) {
    return { title: 'Aktivitas dokumen', icon: 'description', iconClass: 'bg-blue-100 text-blue-700' };
  }
  if (action.indexOf('LOGIN') !== -1 || action.indexOf('LOGOUT') !== -1 || action.indexOf('PASSWORD') !== -1) {
    var t = action.indexOf('LOGOUT') !== -1 ? 'Pengguna keluar' : (action.indexOf('LOGIN') !== -1 ? 'Pengguna masuk' : 'Keamanan akun');
    return { title: t, icon: action.indexOf('LOGOUT') !== -1 ? 'logout' : 'shield_person', iconClass: 'bg-slate-100 text-slate-700' };
  }
  if (action.indexOf('PEGAWAI_CREATE') !== -1) {
    return { title: 'Pegawai ditambahkan', icon: 'person_add', iconClass: 'bg-teal-100 text-teal-700' };
  }
  if (action.indexOf('PEGAWAI_DELETE') !== -1) {
    return { title: 'Data pegawai dihapus', icon: 'person_remove', iconClass: 'bg-rose-100 text-rose-700' };
  }
  if (action.indexOf('PEGAWAI') !== -1 || action.indexOf('PROFILE') !== -1) {
    return { title: 'Data pegawai diperbarui', icon: 'manage_accounts', iconClass: 'bg-purple-100 text-purple-700' };
  }
  if (action.indexOf('BACKUP') !== -1) {
    return { title: 'Backup sistem', icon: 'cloud_done', iconClass: 'bg-cyan-100 text-cyan-700' };
  }
  if (action.indexOf('CONFIG') !== -1) {
    return { title: 'Konfigurasi sistem', icon: 'settings', iconClass: 'bg-indigo-100 text-indigo-700' };
  }
  return { title: 'Aktivitas sistem', icon: 'info', iconClass: 'bg-surface-container-high text-primary' };
};

SIKAP.DashboardAdmin._getResultMeta = function(result) {
  var n = String(result || '').toUpperCase();
  if (n.indexOf('FAIL') !== -1 || n.indexOf('ERROR') !== -1 || n.indexOf('GAGAL') !== -1) {
    return { label: 'Gagal', className: 'bg-rose-100 text-rose-800 ring-rose-200/80' };
  }
  if (n.indexOf('SUCCESS') !== -1 || n.indexOf('BERHASIL') !== -1) {
    return { label: 'Berhasil', className: 'bg-emerald-100 text-emerald-800 ring-emerald-200/80' };
  }
  return { label: result || 'Tercatat', className: 'bg-surface-container-high text-on-surface-variant ring-outline-variant/40' };
};
</script>
