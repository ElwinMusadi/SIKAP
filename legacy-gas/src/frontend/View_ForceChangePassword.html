<!-- ============================================================ -->
<!-- View_ForceChangePassword.html — Force Change Password       -->
<!-- Faithfully reproduces Halaman Ubah Password.html             -->
<!-- ============================================================ -->

<div class="flex flex-col w-full h-screen overflow-hidden items-center justify-center px-md lg:px-container-margin relative">
  <!-- Background -->
  <div class="absolute inset-0 bg-gradient-to-br from-surface-container-highest via-surface to-surface-container opacity-50 -z-10"></div>
  <div class="absolute inset-0 overflow-hidden pointer-events-none -z-10">
    <svg class="absolute top-0 right-0 -mr-32 -mt-32 text-primary opacity-5" fill="currentColor" height="400" viewBox="0 0 400 400" width="400">
      <circle cx="200" cy="200" r="200"></circle>
    </svg>
    <svg class="absolute bottom-0 left-0 -ml-32 -mb-32 text-secondary opacity-5" fill="currentColor" height="600" viewBox="0 0 600 600" width="600">
      <circle cx="300" cy="300" r="300"></circle>
    </svg>
  </div>

  <!-- Card -->
  <div class="w-full max-w-lg bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden relative z-10 transition-transform duration-300 hover:scale-[1.01]">
    <!-- Gradient accent bar -->
    <div class="h-2 w-full bg-gradient-to-r from-primary to-primary-container"></div>

    <div class="p-xl flex flex-col gap-xl">
      <!-- Header -->
      <div class="flex flex-col items-center text-center gap-sm">
        <div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-md shadow-sm">
          <span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
        </div>
        <h1 class="font-h1 text-h1 text-on-surface">Amankan Akun Anda</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">
          Untuk keamanan data kepegawaian, Anda wajib mengganti password default sebelum melanjutkan.
        </p>
      </div>

      <!-- Form -->
      <form class="flex flex-col gap-lg" id="fcp-form" onsubmit="SIKAP.Auth.handleForceChangePassword(event)">
        <!-- New Password -->
        <div class="flex flex-col gap-sm relative">
          <label class="font-label-md text-label-md text-on-surface" for="fcp-new-password">Password Baru</label>
          <div class="relative group">
            <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
            <input class="w-full bg-surface-container rounded-lg font-body-md text-body-md text-on-surface pl-10 pr-10 py-3 outline-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all"
                   id="fcp-new-password" placeholder="Masukkan password baru" required type="password"
                   oninput="SIKAP.Auth.validateForceChangePassword()">
            <button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/20"
                    onclick="SIKAP.Auth.togglePasswordVisibility('fcp-new-password', 'fcp-toggle-icon-1')" type="button">
              <span class="material-symbols-outlined text-sm" id="fcp-toggle-icon-1">visibility</span>
            </button>
          </div>

          <!-- Password Requirements -->
          <div class="bg-surface-container-low p-md rounded-lg mt-unit">
            <p class="font-label-sm text-label-sm text-on-surface-variant mb-unit">Persyaratan Password:</p>
            <ul class="flex flex-col gap-unit font-body-sm text-body-sm text-secondary">
              <li class="flex items-center gap-unit transition-colors duration-300" id="fcp-req-length">
                <span class="material-symbols-outlined text-sm">close</span> Minimal 8 karakter
              </li>
              <li class="flex items-center gap-unit transition-colors duration-300" id="fcp-req-case">
                <span class="material-symbols-outlined text-sm">close</span> Huruf besar &amp; kecil
              </li>
              <li class="flex items-center gap-unit transition-colors duration-300" id="fcp-req-number">
                <span class="material-symbols-outlined text-sm">close</span> Minimal 1 angka
              </li>
            </ul>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="flex flex-col gap-sm relative">
          <label class="font-label-md text-label-md text-on-surface" for="fcp-confirm-password">Konfirmasi Password</label>
          <div class="relative group">
            <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock_reset</span>
            <input class="w-full bg-surface-container rounded-lg font-body-md text-body-md text-on-surface pl-10 pr-10 py-3 outline-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all"
                   id="fcp-confirm-password" placeholder="Ulangi password baru" required type="password"
                   oninput="SIKAP.Auth.validateForceChangePassword()">
            <button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/20"
                    onclick="SIKAP.Auth.togglePasswordVisibility('fcp-confirm-password', 'fcp-toggle-icon-2')" type="button">
              <span class="material-symbols-outlined text-sm" id="fcp-toggle-icon-2">visibility</span>
            </button>
          </div>
          <p class="font-body-sm text-body-sm text-error h-4 mt-unit opacity-0 transition-opacity" id="fcp-match-message"></p>
        </div>

        <!-- Submit Button -->
        <button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-lg shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-unit group opacity-50 cursor-not-allowed"
                disabled id="fcp-submit-btn" type="submit">
          Simpan Password &amp; Lanjutkan
          <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
        </button>
      </form>
    </div>
  </div>
</div>
