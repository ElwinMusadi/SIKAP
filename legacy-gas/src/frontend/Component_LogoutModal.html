<!-- ============================================================ -->
<!-- Component_LogoutModal.html — Global Logout Confirmation Modal-->
<!-- ============================================================ -->

<div class="fixed inset-0 z-[250] hidden items-center justify-center" id="app-logout-modal">
  <!-- Overlay -->
  <div class="absolute inset-0 bg-on-background/40 backdrop-blur-sm" onclick="SIKAP.Auth.closeLogoutModal()"></div>

  <!-- Card -->
  <div class="relative z-50 w-full max-w-md bg-surface-container-lowest rounded-xl shadow-2xl overflow-hidden mx-4 transform transition-all scale-95 opacity-0 duration-200"
       id="app-logout-card">
    <div class="p-xl flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-full bg-error-container text-error flex items-center justify-center mb-lg shadow-sm">
        <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">logout</span>
      </div>
      <h2 class="font-h2 text-on-surface mb-sm">Konfirmasi Keluar</h2>
      <p class="font-body-md text-on-surface-variant mb-xl">
        Apakah Anda yakin ingin keluar dari sistem SIKAP? Anda perlu melakukan login kembali untuk mengakses aplikasi.
      </p>
      <div class="flex w-full gap-md">
        <button type="button"
                class="flex-1 px-lg py-md rounded-lg bg-surface-container text-on-surface hover:bg-surface-container-high transition-colors font-label-md cursor-pointer"
                onclick="SIKAP.Auth.closeLogoutModal()">
          Batal
        </button>
        <button type="button"
                class="flex-1 px-lg py-md rounded-lg bg-error text-on-error hover:bg-error/90 transition-colors font-label-md flex items-center justify-center gap-xs shadow-sm cursor-pointer"
                onclick="SIKAP.Auth.confirmLogout()">
          <span class="material-symbols-outlined text-[18px]">logout</span>
          Ya, Keluar
        </button>
      </div>
    </div>
  </div>
</div>
