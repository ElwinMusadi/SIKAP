name: Deploy Google Apps Script (Development)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build GAS Target
        run: npm run build:gas

      - name: Authenticate Clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push to Apps Script
        # Hanya melakukan push ke versi HEAD (Development).
        # TIDAK men-deploy versi baru ke Web App Production.
        run: npx clasp push -f
