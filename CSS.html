<style>
  /* ============================================ */
  /* CSS.html — Custom Styles for SIKAP           */
  /* ============================================ */

  /* Base reset for GAS iframe */
  html, body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    overscroll-behavior: none;
  }

  /* Hide scrollbar but allow scrolling */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #c5c5d3;
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #757682;
  }

  /* View transitions */
  .view-container {
    animation: fadeIn 0.2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Toast slide-in animation */
  @keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }

  @keyframes slideOutRight {
    from { transform: translateX(0); opacity: 1; }
    to   { transform: translateX(100%); opacity: 0; }
  }

  .toast-enter {
    animation: slideInRight 0.3s ease-out forwards;
  }

  .toast-exit {
    animation: slideOutRight 0.3s ease-in forwards;
  }

  /* Sidebar transitions for mobile */
  .sidebar-enter {
    transform: translateX(-100%);
    transition: transform 0.3s ease-out;
  }
  .sidebar-enter.sidebar-open {
    transform: translateX(0);
  }

  /* Skeleton pulse (custom) */
  @keyframes shimmer {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, #dce9ff 25%, #e5eeff 50%, #dce9ff 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }

  /* Prevent text selection on navigation items */
  nav a, nav button {
    user-select: none;
    -webkit-user-select: none;
  }

  /* Focus styles for accessibility */
  *:focus-visible {
    outline: 2px solid #00236f;
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* Input placeholder styling */
  input::placeholder {
    color: #757682;
    opacity: 0.7;
  }
</style>
