pages_build_output_dir = "../../dist-uat-app"

[vars]
APP_URL = "https://sikap-uat.pages.dev"
SESSION_TTL_HOURS = "12"
ACCESS_REQUIRED = "1"
ACCESS_TEAM_DOMAIN = "shy-thunder-ffc9.cloudflareaccess.com"
