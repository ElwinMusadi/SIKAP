<script>
// ============================================================
// JS_ArsipDokumen.html — Arsip Dokumen Controller
// ============================================================

SIKAP.Arsip = SIKAP.Arsip || {};

// State
SIKAP.Arsip.state = {
  docs: [],
  selectedFile: null,
  uploadingId: null, // Holds doc ID during penolakan -> reupload flow
};

/**
 * Main load function called by Router onViewEnter.
 */
SIKAP.Arsip.load = function() {
  SIKAP.UI.showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        SIKAP.Arsip.state.docs = result.data.tableRows;
        SIKAP.Arsip.renderSummary(result.data);
        SIKAP.Arsip.renderTable(result.data.tableRows);
        SIKAP.Arsip.populateUploadSelect(result.data.tableRows);
      } else {
        SIKAP.Toast.show(result.message, 'error');
      }
      SIKAP.UI.hideLoading();
    })
    .withFailureHandler(function(error) {
      SIKAP.Toast.show('Terjadi kesalahan jaringan.', 'error');
      SIKAP.UI.hideLoading();
    })
    .getArsipDokumenPegawai(SIKAP.state.token);
};

// ============================================================
// RENDERERS
// ============================================================

/**
 * Updates the top summary card.
 */
SIKAP.Arsip.renderSummary = function(data) {
  var pct = data.pct;
  
  // Update text
  document.getElementById('arsip-progress-text').textContent = pct + '%';
  document.getElementById('arsip-progress-desc').innerHTML = 
    '<strong>' + data.wajibVerified + ' dari ' + data.wajibTotal + '</strong> dokumen wajib telah berhasil diverifikasi oleh tim kepegawaian.';
  
  // Animate Bar
  var bar = document.getElementById('arsip-progress-bar');
  if (bar) bar.style.width = pct + '%';
  
  // Animate Circle
  var circle = document.getElementById('arsip-progress-circle');
  if (circle) {
    var totalLength = 251.2;
    var offset = totalLength - ((pct / 100) * totalLength);
    circle.style.strokeDashoffset = offset;
  }
  
  // Update counts
  document.getElementById('arsip-count-verified').textContent = data.counts.terverifikasi;
  document.getElementById('arsip-count-waiting').textContent = data.counts.menunggu;
  document.getElementById('arsip-count-rejected').textContent = data.counts.ditolak;
  document.getElementById('arsip-count-empty').textContent = data.counts.belumUnggah;
};

/**
 * Renders the documents table.
 */
SIKAP.Arsip.renderTable = function(rows) {
  var tbody = document.getElementById('arsip-table-body');
  if (!tbody) return;
  
  if (!rows || rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="px-5 py-8 text-center text-on-surface-variant">Tidak ada dokumen yang ditemukan.</td></tr>';
    return;
  }
  
  var html = '';
  rows.forEach(function(r) {
    var statusInfo = SIKAP.Arsip.getStatusInfo(r.status, r.catatan);
    
    // Build row classes based on status
    var rowClass = 'hover:bg-surface-container-low transition-colors group';
    if (r.status === 'Ditolak') {
      rowClass += ' bg-error-container/20';
    } else if (r.status === 'Belum Unggah') {
      rowClass += ' bg-surface-container-lowest opacity-75 hover:opacity-100';
    }
    
    html += '<tr class="' + rowClass + '">';
    
    // Col 1: Icon
    html += '<td class="px-5 py-3">' + statusInfo.iconHtml + '</td>';
    
    // Col 2: Name
    html += '<td class="px-5 py-3 font-label-md text-on-surface">' + r.nama + '</td>';
    
    // Col 3: Wajib Badge
    html += '<td class="px-5 py-3">';
    if (r.wajib === 'Ya') {
      html += '<span class="px-2.5 py-1 bg-surface-container-highest text-on-surface-variant text-[11px] font-label-sm rounded uppercase tracking-wide">Wajib</span>';
    } else {
      html += '<span class="px-2.5 py-1 bg-surface-container-low text-on-surface-variant text-[11px] border border-outline-variant/30 font-label-sm rounded uppercase tracking-wide">Opsional</span>';
    }
    html += '</td>';
    
    // Col 4: Status Badge
    html += '<td class="px-5 py-3">' + statusInfo.badgeHtml + '</td>';
    
    // Col 5: Time / Detail
    html += '<td class="px-5 py-3">';
    if (r.waktuUpload && r.waktuUpload !== '-') {
      html += '<span class="text-[12px] text-on-surface-variant">' + r.waktuUpload + '</span>';
    } else {
      html += '<span class="text-[12px] text-on-surface-variant italic">-</span>';
    }
    html += '</td>';
    
    // Col 6: Actions
    html += '<td class="px-5 py-3"><div class="flex items-center justify-end gap-2">';
    
    if (r.status === 'Terverifikasi' || r.status === 'Menunggu') {
      // Normal actions (hidden until hover)
      html += '<div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-2">';
      html += '<button onclick="SIKAP.Arsip.openPreviewModal(\'' + r.idArsip + '\')" aria-label="Preview" class="p-2 text-on-surface-variant hover:text-primary hover:bg-primary/10 rounded-lg transition-colors tooltip">';
      html += '<span class="material-symbols-outlined text-[20px]">visibility</span></button>';
      html += '</div>';
    } else if (r.status === 'Ditolak') {
      // Action button always visible
      html += '<button onclick="SIKAP.Arsip.openPenolakanModal(\'' + r.idArsip + '\')" class="px-3 py-1.5 bg-error/10 text-error hover:bg-error/20 rounded-lg font-label-sm transition-colors flex items-center gap-1">';
      html += '<span class="material-symbols-outlined text-[16px]">upload</span> Revisi</button>';
    } else if (r.status === 'Belum Unggah' || r.status === 'Belum_Unggah' || (r.status && r.status.indexOf('Belum') !== -1)) {
      // Action button always visible
      var btnClass = r.wajib === 'Ya' 
        ? 'border border-primary text-primary hover:bg-primary/5' 
        : 'text-on-surface-variant hover:text-primary hover:bg-primary/5';
      html += '<button onclick="SIKAP.Arsip.openUploadModal(\'' + r.idDokumen + '\')" class="px-3 py-1.5 ' + btnClass + ' rounded-lg font-label-sm transition-colors flex items-center gap-1">';
      if (r.wajib === 'Ya') html += '<span class="material-symbols-outlined text-[16px]">upload</span>';
      html += 'Unggah</button>';
    }
    
    html += '</div></td></tr>';
  });
  
  tbody.innerHTML = html;
};

/**
 * Returns formatted HTML for status displays.
 */
SIKAP.Arsip.getStatusInfo = function(status, catatan) {
  var iconHtml = '';
  var badgeHtml = '';
  
  if (status === 'Terverifikasi') {
    iconHtml = '<div class="w-10 h-10 rounded-lg bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0"><span class="material-symbols-outlined">description</span></div>';
    badgeHtml = '<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#e6f4ea] text-[#137333] font-label-sm"><span class="material-symbols-outlined text-[14px]">check_circle</span> Terverifikasi</div>';
  } 
  else if (status === 'Menunggu') {
    iconHtml = '<div class="w-10 h-10 rounded-lg bg-[#fef7e0] text-[#b06000] flex items-center justify-center shrink-0"><span class="material-symbols-outlined">pending</span></div>';
    badgeHtml = '<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#fef7e0] text-[#b06000] font-label-sm"><span class="material-symbols-outlined text-[14px]">pending</span> Menunggu Verifikasi</div>';
  } 
  else if (status === 'Ditolak') {
    iconHtml = '<div class="w-10 h-10 rounded-lg bg-error-container text-on-error-container flex items-center justify-center shrink-0"><span class="material-symbols-outlined">account_balance_wallet</span></div>';
    badgeHtml = '<div class="flex flex-col gap-1 items-start"><div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-error-container text-on-error-container font-label-sm"><span class="material-symbols-outlined text-[14px]">error</span> Perlu Revisi</div><span class="text-[11px] text-error font-medium italic flex items-center gap-1 mt-1 truncate max-w-[150px]" title="' + catatan + '"><span class="material-symbols-outlined text-[12px]">info</span> "' + catatan + '"</span></div>';
  } 
  else {
    iconHtml = '<div class="w-10 h-10 rounded-lg bg-surface-container-highest text-on-surface-variant border border-dashed border-outline-variant flex items-center justify-center shrink-0"><span class="material-symbols-outlined opacity-50">school</span></div>';
    badgeHtml = '<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-variant text-on-surface-variant font-label-sm"><span class="material-symbols-outlined text-[14px]">remove</span> Belum Diunggah</div>';
  }
  
  return { iconHtml: iconHtml, badgeHtml: badgeHtml };
};


// ============================================================
// UPLOAD MODAL LOGIC
// ============================================================

/**
 * Fills the document type dropdown. Only shows docs that are NOT Menunggu or Terverifikasi.
 */
SIKAP.Arsip.populateUploadSelect = function(docs) {
  var sel = document.getElementById('arsip-upload-select');
  if (!sel) return;
  
  // Clear existing
  sel.innerHTML = '<option value="" disabled selected>Pilih jenis dokumen...</option>';
  
  docs.forEach(function(d) {
    // Hide if already waiting or verified
    if (d.status === 'Menunggu' || d.status === 'Terverifikasi') return;
    
    var text = d.nama;
    if (d.wajib === 'Ya') text += ' (Wajib)';
    else text += ' (Opsional)';
    
    if (d.status === 'Ditolak') text += ' — Perlu Revisi';
    
    sel.innerHTML += '<option value="' + d.idDokumen + '">' + text + '</option>';
  });
};

SIKAP.Arsip.openUploadModal = function(preselectId) {
  document.getElementById('modal-upload-dokumen').classList.remove('hidden');
  SIKAP.Arsip.clearSelectedFile();
  
  var sel = document.getElementById('arsip-upload-select');
  if (preselectId && sel) {
    sel.value = preselectId;
    sel.disabled = true; // Lock selection if launched from specific row
    SIKAP.Arsip.state.uploadingId = preselectId;
  } else {
    sel.value = '';
    sel.disabled = false;
    SIKAP.Arsip.state.uploadingId = null;
  }
};

SIKAP.Arsip.closeUploadModal = function() {
  document.getElementById('modal-upload-dokumen').classList.add('hidden');
};

// File Selection Handler
document.addEventListener('DOMContentLoaded', function() {
  var fileInput = document.getElementById('arsip-upload-file');
  if (fileInput) {
    fileInput.addEventListener('change', function(e) {
      if (this.files && this.files[0]) {
        SIKAP.Arsip.handleFileSelect(this.files[0]);
      }
    });
  }
  
  // Handle select change
  var sel = document.getElementById('arsip-upload-select');
  if (sel) {
    sel.addEventListener('change', function() {
      SIKAP.Arsip.state.uploadingId = this.value;
      SIKAP.Arsip.updateUploadBtnState();
    });
  }
});

SIKAP.Arsip.handleFileSelect = function(file) {
  // Validate size (5MB)
  if (file.size > 5 * 1024 * 1024) {
    SIKAP.Toast.show('Ukuran file maksimal 5MB.', 'error');
    return;
  }
  
  // Validate type
  var allowedTypes = ['application/pdf', 'image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/jfif', 'image/pjpeg'];
  var ext = (file.name || '').split('.').pop().toLowerCase();
  var isAllowedExt = ['pdf', 'jpg', 'jpeg', 'png', 'webp', 'jfif'].indexOf(ext) !== -1;
  
  if (allowedTypes.indexOf(file.type) === -1 && !isAllowedExt) {
    SIKAP.Toast.show('Format file tidak didukung. Gunakan PDF, JPG, PNG, atau WEBP.', 'error');
    return;
  }
  
  SIKAP.Arsip.state.selectedFile = file;
  
  // Update UI
  document.getElementById('arsip-upload-dropzone').classList.add('hidden');
  document.getElementById('arsip-upload-selected').classList.remove('hidden');
  document.getElementById('arsip-upload-filename').textContent = file.name;
  
  var mb = (file.size / (1024 * 1024)).toFixed(2);
  document.getElementById('arsip-upload-filesize').textContent = mb + ' MB';
  
  var icon = 'description';
  if (file.type.indexOf('pdf') !== -1) icon = 'picture_as_pdf';
  else if (file.type.indexOf('image') !== -1) icon = 'image';
  document.getElementById('arsip-upload-icon').textContent = icon;
  
  SIKAP.Arsip.updateUploadBtnState();
};

SIKAP.Arsip.clearSelectedFile = function() {
  SIKAP.Arsip.state.selectedFile = null;
  var input = document.getElementById('arsip-upload-file');
  if (input) input.value = '';
  
  document.getElementById('arsip-upload-dropzone').classList.remove('hidden');
  document.getElementById('arsip-upload-selected').classList.add('hidden');
  
  SIKAP.Arsip.updateUploadBtnState();
};

SIKAP.Arsip.updateUploadBtnState = function() {
  var btn = document.getElementById('arsip-btn-upload');
  if (!btn) return;
  
  if (SIKAP.Arsip.state.selectedFile && SIKAP.Arsip.state.uploadingId) {
    btn.disabled = false;
  } else {
    btn.disabled = true;
  }
};

/**
 * Handles the actual upload process.
 * Reads file to base64, calls server to upload.
 */
SIKAP.Arsip.submitUpload = function() {
  var file = SIKAP.Arsip.state.selectedFile;
  var docId = SIKAP.Arsip.state.uploadingId;
  
  if (!file || !docId) return;
  
  // Set UI to loading state
  var btn = document.getElementById('arsip-btn-upload');
  var progress = document.getElementById('arsip-upload-progress-container');
  var removeBtn = document.getElementById('arsip-upload-remove');
  var closeBtn = document.getElementById('btn-close-upload');
  var cancelBtn = document.getElementById('btn-cancel-upload');
  var select = document.getElementById('arsip-upload-select');
  
  btn.disabled = true;
  removeBtn.disabled = true;
  closeBtn.disabled = true;
  cancelBtn.disabled = true;
  select.disabled = true;
  document.getElementById('upload-btn-text').textContent = 'Mengunggah...';
  document.getElementById('upload-btn-icon').textContent = 'sync';
  document.getElementById('upload-btn-icon').classList.add('animate-spin');
  progress.classList.remove('hidden');
  
  // Show app blocking loader
  SIKAP.UI.showLoading();
  
  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    var base64Data = dataUrl.split(',')[1];
    var mimeType = file.type || '';
    if (!mimeType) {
      var n = (file.name || '').toLowerCase();
      if (n.indexOf('.pdf') !== -1) mimeType = 'application/pdf';
      else if (n.indexOf('.png') !== -1) mimeType = 'image/png';
      else if (n.indexOf('.webp') !== -1) mimeType = 'image/webp';
      else mimeType = 'image/jpeg';
    }
    
    // Call server
    google.script.run
      .withSuccessHandler(function(res) {
        SIKAP.UI.hideLoading();
        if (res.success) {
          SIKAP.Toast.show(res.message, 'success');
          SIKAP.Arsip.closeUploadModal();
          // Reload data silently to update table
          SIKAP.Arsip.load(); 
        } else {
          SIKAP.Toast.show(res.message, 'error');
          SIKAP.Arsip.resetUploadUIState();
        }
      })
      .withFailureHandler(function(err) {
        SIKAP.UI.hideLoading();
        SIKAP.Toast.show('Terjadi kesalahan jaringan.', 'error');
        SIKAP.Arsip.resetUploadUIState();
      })
      .uploadDokumen(SIKAP.state.token, docId, base64Data, mimeType);
  };
  
  reader.onerror = function() {
    SIKAP.UI.hideLoading();
    SIKAP.Toast.show('Gagal membaca file lokal.', 'error');
    SIKAP.Arsip.resetUploadUIState();
  };
  
  reader.readAsDataURL(file);
};

SIKAP.Arsip.resetUploadUIState = function() {
  var btn = document.getElementById('arsip-btn-upload');
  var progress = document.getElementById('arsip-upload-progress-container');
  var removeBtn = document.getElementById('arsip-upload-remove');
  var closeBtn = document.getElementById('btn-close-upload');
  var cancelBtn = document.getElementById('btn-cancel-upload');
  var select = document.getElementById('arsip-upload-select');
  
  btn.disabled = false;
  removeBtn.disabled = false;
  closeBtn.disabled = false;
  cancelBtn.disabled = false;
  // Select disabled state depends on whether it was launched specifically or not, 
  // but let's just make it editable unless specifically blocked
  // It's safer to just rely on re-opening logic.
  
  document.getElementById('upload-btn-text').textContent = 'Upload Dokumen';
  document.getElementById('upload-btn-icon').textContent = 'upload';
  document.getElementById('upload-btn-icon').classList.remove('animate-spin');
  progress.classList.add('hidden');
};


// ============================================================
// PREVIEW MODAL LOGIC
// ============================================================

SIKAP.Arsip.openPreviewModal = function(idArsip) {
  document.getElementById('modal-preview-dokumen').classList.remove('hidden');
  document.getElementById('preview-loader').classList.remove('hidden');
  
  // Reset fields
  document.getElementById('preview-nama-dokumen').textContent = 'Memuat...';
  document.getElementById('preview-waktu-upload').textContent = '-';
  document.getElementById('preview-status-text').textContent = 'MEMUAT';
  document.getElementById('preview-waktu-verifikasi').textContent = '';
  document.getElementById('preview-catatan-container').classList.add('hidden');
  document.getElementById('preview-iframe').src = 'about:blank';
  
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        var d = res.data;
        document.getElementById('preview-nama-dokumen').textContent = d.namaDokumen;
        document.getElementById('preview-waktu-upload').textContent = d.waktuUpload;
        
        // Iframe / Links
        document.getElementById('preview-iframe').src = d.previewUrl;
        document.getElementById('preview-btn-download').href = d.downloadUrl;
        document.getElementById('preview-btn-newtab').href = d.previewUrl;
        
        // Status Badge
        var badge = document.getElementById('preview-status-badge');
        var text = document.getElementById('preview-status-text');
        var icon = document.getElementById('preview-status-icon');
        
        // Reset classes
        badge.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full';
        text.textContent = d.statusVerifikasi.toUpperCase();
        
        if (d.statusVerifikasi === 'Terverifikasi') {
          badge.classList.add('bg-[#dcfce7]', 'text-[#166534]');
          icon.textContent = 'check_circle';
        } else if (d.statusVerifikasi === 'Menunggu') {
          badge.classList.add('bg-[#fef7e0]', 'text-[#b06000]');
          icon.textContent = 'pending';
        } else if (d.statusVerifikasi === 'Ditolak') {
          badge.classList.add('bg-error-container', 'text-on-error-container');
          icon.textContent = 'error';
        }
        
        // Verifier text
        if (d.statusVerifikasi !== 'Menunggu') {
          document.getElementById('preview-waktu-verifikasi').textContent = 'Diverifikasi oleh ' + (d.namaVerifier || 'Admin') + ' pada ' + d.waktuVerifikasi;
        }
        
        // Catatan Admin
        if (d.catatanAdmin && d.catatanAdmin.trim() !== '') {
          document.getElementById('preview-catatan-container').classList.remove('hidden');
          document.getElementById('preview-catatan-admin').textContent = d.catatanAdmin;
        }
        
      } else {
        SIKAP.Toast.show(res.message, 'error');
        SIKAP.Arsip.closePreviewModal();
        if (SIKAP.Arsip.load) SIKAP.Arsip.load();
      }
    })
    .withFailureHandler(function() {
      SIKAP.Toast.show('Terjadi kesalahan jaringan.', 'error');
      SIKAP.Arsip.closePreviewModal();
    })
    .getDokumenPreview(SIKAP.state.token, idArsip);
};

SIKAP.Arsip.closePreviewModal = function() {
  document.getElementById('modal-preview-dokumen').classList.add('hidden');
  document.getElementById('preview-iframe').src = 'about:blank';
};


// ============================================================
// PENOLAKAN MODAL LOGIC
// ============================================================

SIKAP.Arsip.openPenolakanModal = function(idArsip) {
  document.getElementById('modal-detail-penolakan').classList.remove('hidden');
  
  // Find record from local state
  var record = SIKAP.Arsip.state.docs.find(function(d) { return d.idArsip === idArsip; });
  if (!record) return;
  
  document.getElementById('penolakan-nama-dokumen').textContent = record.nama;
  document.getElementById('penolakan-catatan-admin').textContent = record.catatan;
  
  // Save idDokumen for re-upload flow
  SIKAP.Arsip.state.uploadingId = record.idDokumen;
};

SIKAP.Arsip.closePenolakanModal = function() {
  document.getElementById('modal-detail-penolakan').classList.add('hidden');
};

SIKAP.Arsip.reuploadFromPenolakan = function() {
  SIKAP.Arsip.closePenolakanModal();
  // Open upload modal with specific doc ID pre-selected
  SIKAP.Arsip.openUploadModal(SIKAP.Arsip.state.uploadingId);
};

</script>
