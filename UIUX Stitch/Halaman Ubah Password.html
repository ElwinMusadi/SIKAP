<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen items-center justify-center"><main class="w-full"><div class="flex flex-col w-full h-full items-center justify-center p-md lg:p-container-margin relative">
<div class="absolute inset-0 bg-gradient-to-br from-surface-container-highest via-surface to-surface-container opacity-50 -z-10"></div>
<div class="absolute inset-0 overflow-hidden pointer-events-none -z-10">
<svg class="absolute top-0 right-0 -mr-32 -mt-32 text-primary opacity-5" fill="currentColor" height="400" viewBox="0 0 400 400" width="400" xmlns="http://www.w3.org/2000/svg">
<circle cx="200" cy="200" r="200"></circle>
</svg>
<svg class="absolute bottom-0 left-0 -ml-32 -mb-32 text-secondary opacity-5" fill="currentColor" height="600" viewBox="0 0 600 600" width="600" xmlns="http://www.w3.org/2000/svg">
<circle cx="300" cy="300" r="300"></circle>
</svg>
</div>
<div class="w-full max-w-lg bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden relative z-10 transition-transform duration-300 hover:scale-[1.01]">
<div class="h-2 w-full bg-gradient-to-r from-primary to-primary-container"></div>
<div class="p-xl flex flex-col gap-xl">
<div class="flex flex-col items-center text-center gap-sm">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
            shield_lock
          </span>
</div>
<h1 class="font-h1 text-h1 text-on-surface">Amankan Akun Anda</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">
          Untuk keamanan data kepegawaian, Anda wajib mengganti password default sebelum melanjutkan.
        </p>
</div>
<form class="flex flex-col gap-lg" id="force-change-password-form">
<div class="flex flex-col gap-sm relative">
<label class="font-label-md text-label-md text-on-surface" for="new-password">Password Baru</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">
              lock
            </span>
<input class="w-full bg-surface-container rounded-lg font-body-md text-body-md text-on-surface pl-10 pr-10 py-3 outline-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" id="new-password" placeholder="Masukkan password baru" required="" type="password">
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/20" onclick="togglePasswordVisibility('new-password', 'toggle-icon-1')" type="button">
<span class="material-symbols-outlined text-sm" id="toggle-icon-1">visibility</span>
</button>
</div>
<div class="bg-surface-container-low p-md rounded-lg mt-unit">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-unit">Persyaratan Password:</p>
<ul class="flex flex-col gap-unit font-body-sm text-body-sm text-secondary">
<li class="flex items-center gap-unit transition-colors duration-300" id="req-length">
<span class="material-symbols-outlined text-sm">close</span> Minimal 8 karakter
               </li>
<li class="flex items-center gap-unit transition-colors duration-300" id="req-case">
<span class="material-symbols-outlined text-sm">close</span> Huruf besar &amp; kecil
               </li>
<li class="flex items-center gap-unit transition-colors duration-300" id="req-number">
<span class="material-symbols-outlined text-sm">close</span> Minimal 1 angka
               </li>
</ul>
</div>
</div>
<div class="flex flex-col gap-sm relative">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">Konfirmasi Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">
              lock_reset
            </span>
<input class="w-full bg-surface-container rounded-lg font-body-md text-body-md text-on-surface pl-10 pr-10 py-3 outline-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" id="confirm-password" placeholder="Ulangi password baru" required="" type="password">
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/20" onclick="togglePasswordVisibility('confirm-password', 'toggle-icon-2')" type="button">
<span class="material-symbols-outlined text-sm" id="toggle-icon-2">visibility</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-error h-4 mt-unit opacity-0 transition-opacity" id="match-message"></p>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-lg shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-unit group opacity-50 cursor-not-allowed" disabled="" id="submit-btn" type="submit">
          Simpan Password &amp; Lanjutkan
          <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const submitBtn = document.getElementById('submit-btn');
    const matchMessage = document.getElementById('match-message');

    const reqLength = document.getElementById('req-length');
    const reqCase = document.getElementById('req-case');
    const reqNumber = document.getElementById('req-number');

    function updateRequirementStyle(element, isValid) {
      const icon = element.querySelector('span');
      if (isValid) {
        element.classList.remove('text-secondary');
        element.classList.add('text-primary');
        icon.textContent = 'check';
      } else {
        element.classList.remove('text-primary');
        element.classList.add('text-secondary');
        icon.textContent = 'close';
      }
    }

    function validatePassword() {
      const p = newPasswordInput.value;
      const c = confirmPasswordInput.value;

      const hasLength = p.length >= 8;
      const hasCase = /[a-z]/.test(p) && /[A-Z]/.test(p);
      const hasNumber = /\d/.test(p);
      const isMatch = p === c && p !== '';

      updateRequirementStyle(reqLength, hasLength);
      updateRequirementStyle(reqCase, hasCase);
      updateRequirementStyle(reqNumber, hasNumber);

      if (c !== '') {
          if(!isMatch) {
              matchMessage.textContent = "Password tidak cocok.";
              matchMessage.classList.remove('opacity-0');
          } else {
              matchMessage.textContent = "";
              matchMessage.classList.add('opacity-0');
          }
      } else {
          matchMessage.classList.add('opacity-0');
      }


      const isValid = hasLength && hasCase && hasNumber && isMatch;

      if (isValid) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }

    newPasswordInput.addEventListener('input', validatePassword);
    confirmPasswordInput.addEventListener('input', validatePassword);
    
    document.getElementById('force-change-password-form').addEventListener('submit', (e) => {
        e.preventDefault();
        if(!submitBtn.disabled) {
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span> Menyimpan...';
            // Simulate API call
            setTimeout(() => {
                submitBtn.innerHTML = '<span class="material-symbols-outlined text-sm">check</span> Berhasil';
                submitBtn.classList.remove('bg-primary', 'hover:bg-primary-container');
                submitBtn.classList.add('bg-[#10b981]', 'hover:bg-[#059669]'); // Generic green for success state in this standalone demo
            }, 1500);
        }
    });
  });
</script></main></body></html>
