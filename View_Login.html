<!-- ============================================================ -->
<!-- View_Login.html — Login Screen                              -->
<!-- Faithfully reproduces Halaman Login (Masuk ke Sistem).html   -->
<!-- ============================================================ -->

<div class="flex flex-col w-full h-full items-center justify-center min-h-screen py-xl px-md sm:px-lg lg:px-xl relative">
  <!-- Background decorative gradients -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-20 z-0">
    <svg class="absolute top-0 right-0 transform translate-x-1/3 -translate-y-1/3 w-[800px] h-[800px]" preserveAspectRatio="none" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="login-grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
          <stop offset="0%" stop-color="#dce1ff" stop-opacity="0.5"></stop>
          <stop offset="100%" stop-color="#f8f9ff" stop-opacity="0"></stop>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="50" fill="url(#login-grad1)"></circle>
    </svg>
    <svg class="absolute bottom-0 left-0 transform -translate-x-1/3 translate-y-1/3 w-[600px] h-[600px]" preserveAspectRatio="none" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="login-grad2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
          <stop offset="0%" stop-color="#d5e3fd" stop-opacity="0.3"></stop>
          <stop offset="100%" stop-color="#f8f9ff" stop-opacity="0"></stop>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="50" fill="url(#login-grad2)"></circle>
    </svg>
  </div>

  <!-- Login Card -->
  <div class="bg-surface-container-lowest w-full max-w-[440px] rounded-xl shadow-lg z-10 flex flex-col overflow-hidden relative group transition-transform duration-500 ease-out hover:scale-[1.01]">
    <!-- Top accent bar -->
    <div class="h-2 w-full bg-primary absolute top-0 left-0"></div>

    <div class="px-lg py-xl flex flex-col gap-lg">
      <!-- Header: Logo + Title -->
      <div class="flex flex-col items-center text-center gap-md">
        <div class="w-[88px] h-[88px] rounded-full bg-surface-container-low flex items-center justify-center p-sm mb-sm relative">
          <div class="absolute inset-0 rounded-full bg-primary-fixed opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
          <img alt="Logo Pemprov NTT"
               class="w-full h-full object-contain drop-shadow-sm"
               src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/Coat_of_arms_of_East_Nusa_Tenggara.svg/150px-Coat_of_arms_of_East_Nusa_Tenggara.svg.png">
        </div>
        <div class="flex flex-col gap-xs">
          <h1 class="font-h2 text-on-surface">
            <div><span class="text-on-surface-variant font-semibold">UPTD Pendapatan Daerah </span></div>
            <div><span class="text-on-surface-variant font-semibold">Wilayah Kota Kupang</span></div>
            <div class="mt-2 text-on-surface">Masuk ke Sistem</div>
          </h1>
          <div class="flex flex-col">
            <span class="font-body-sm text-secondary tracking-wide uppercase">Sistem Informasi Data dan Dokumen Kepegawaian</span>
          </div>
        </div>
      </div>

      <!-- Login Form -->
      <form class="flex flex-col gap-md mt-sm" id="login-form" novalidate onsubmit="SIKAP.Auth.handleLogin(event)">
        <!-- NIP Field -->
        <div class="flex flex-col gap-sm relative group/nip">
          <label class="font-label-md text-on-surface transition-colors duration-200 group-focus-within/nip:text-primary" for="login-nip">NIP</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-md text-outline-variant group-focus-within/nip:text-primary transition-colors duration-200">badge</span>
            <input autocomplete="username"
                   class="w-full bg-surface h-12 pl-12 pr-md rounded-lg font-body-md text-on-surface outline-none transition-all duration-300 shadow-[inset_0_0_0_1px_var(--color-outline-variant)] focus:shadow-[inset_0_0_0_1px_var(--color-primary),0_0_0_2px_var(--color-primary-fixed)] placeholder:text-outline/70"
                   id="login-nip" name="nip" placeholder="Masukkan NIP" type="text">
            <div class="absolute bottom-[-20px] left-0 font-body-sm text-error opacity-0 transition-opacity duration-200 pointer-events-none" id="login-nip-error">NIP harus diisi</div>
          </div>
        </div>

        <!-- Password Field -->
        <div class="flex flex-col gap-sm relative group/password">
          <label class="font-label-md text-on-surface transition-colors duration-200 group-focus-within/password:text-primary flex justify-between w-full" for="login-password">
            <span>Password</span>
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-md text-outline-variant group-focus-within/password:text-primary transition-colors duration-200">lock</span>
            <input autocomplete="current-password"
                   class="w-full bg-surface h-12 pl-12 pr-12 rounded-lg font-body-md text-on-surface outline-none transition-all duration-300 shadow-[inset_0_0_0_1px_var(--color-outline-variant)] focus:shadow-[inset_0_0_0_1px_var(--color-primary),0_0_0_2px_var(--color-primary-fixed)] placeholder:text-outline/70"
                   id="login-password" name="password" placeholder="Masukkan password" type="password">
            <button aria-label="Toggle password visibility"
                    class="absolute right-md text-outline-variant hover:text-on-surface transition-colors flex items-center justify-center p-xs rounded-full hover:bg-surface-container"
                    onclick="SIKAP.Auth.togglePasswordVisibility('login-password', 'login-visibility-icon')"
                    type="button">
              <span class="material-symbols-outlined text-[20px]" id="login-visibility-icon">visibility</span>
            </button>
            <div class="absolute bottom-[-20px] left-0 font-body-sm text-error opacity-0 transition-opacity duration-200 pointer-events-none" id="login-password-error">Password harus diisi</div>
          </div>
        </div>

        <!-- Remember me + Forgot password -->
        <div class="flex justify-between items-center mt-xs">
          <label class="flex items-center gap-2 cursor-pointer group/remember">
            <div class="relative flex items-center justify-center w-4 h-4">
              <input class="peer sr-only" id="remember" type="checkbox">
              <div class="w-4 h-4 rounded-[3px] bg-surface shadow-[inset_0_0_0_1px_var(--color-outline-variant)] peer-checked:bg-primary peer-checked:shadow-none transition-all duration-200 group-hover/remember:shadow-[inset_0_0_0_1px_var(--color-primary)]"></div>
              <span class="material-symbols-outlined absolute text-[14px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity duration-200 pointer-events-none" style="font-variation-settings: 'FILL' 1;">check</span>
            </div>
            <span class="font-body-sm text-on-surface-variant group-hover/remember:text-on-surface transition-colors select-none">Ingat saya</span>
          </label>
        </div>

        <!-- Submit Button -->
        <div class="mt-md relative">
          <button class="w-full h-12 bg-primary text-on-primary font-label-md rounded-lg flex items-center justify-center gap-2 transition-all duration-300 hover:bg-primary-container active:scale-[0.98] shadow-sm hover:shadow-md focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2 focus:ring-offset-surface-container-lowest disabled:opacity-70 disabled:cursor-not-allowed group/btn relative overflow-hidden"
                  id="login-btn" type="submit">
            <span class="relative z-10 transition-transform duration-300 group-hover/btn:-translate-y-[1px]" id="login-btn-text">Masuk</span>
            <span class="material-symbols-outlined relative z-10 text-[18px] transition-transform duration-300 group-hover/btn:translate-x-1 group-hover/btn:-translate-y-[1px]" id="login-btn-icon">arrow_forward</span>
            <div class="absolute inset-0 bg-white/20 translate-y-[100%] group-hover/btn:translate-y-0 transition-transform duration-300 ease-out z-0"></div>
            <div class="absolute inset-0 flex items-center justify-center opacity-0 pointer-events-none bg-primary transition-opacity duration-300 z-20" id="login-spinner">
              <svg class="animate-spin h-5 w-5 text-on-primary" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
              </svg>
            </div>
          </button>
        </div>

        <!-- Global Error Message -->
        <div class="hidden mt-2 p-3 rounded bg-error-container text-on-error-container font-body-sm flex items-start gap-2 border-l-2 border-error opacity-0 transition-opacity duration-300" id="login-global-error">
          <span class="material-symbols-outlined text-[18px]">error</span>
          <span class="mt-0.5" id="login-global-error-msg">Kredensial tidak valid.</span>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="bg-surface-container-low px-lg py-md border-t border-surface-variant flex justify-center items-center">
      <p class="font-body-sm text-secondary flex items-center gap-1 opacity-80">
        <span class="material-symbols-outlined text-[16px]">lock</span>
        Akses aman terenkripsi
      </p>
    </div>
  </div>

  <!-- Copyright -->
  <div class="mt-xl text-center flex flex-col gap-1 opacity-60 pointer-events-none z-10">
    <span class="font-body-sm text-on-surface-variant">© 2025 UPTD Pendapatan Daerah Wilayah Kota Kupang.</span>
    <span class="font-body-sm text-on-surface-variant">Versi 1.0.0</span>
  </div>
</div>
