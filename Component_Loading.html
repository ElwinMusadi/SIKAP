<!-- ============================================================ -->
<!-- Component_Loading.html — Global Blocking Overlay             -->
<!-- Reproduces the Stitch Global UI System loading overlay       -->
<!-- ============================================================ -->

<!-- Blocking Overlay (Hidden by default) -->
<div id="global-loading-overlay" class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-[100] hidden items-center justify-center pointer-events-auto" style="display:none;">
  <div class="bg-surface-container-lowest rounded-xl p-xl shadow-xl flex flex-col items-center gap-md">
    <svg class="animate-spin h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
    </svg>
    <p class="font-label-md text-label-md text-on-surface" id="loading-overlay-text">Memproses...</p>
  </div>
</div>

<script>
  SIKAP.Loading = {};

  /**
   * Shows the global blocking overlay.
   * @param {string} text - Optional loading text.
   */
  SIKAP.Loading.show = function(text) {
    var overlay = document.getElementById('global-loading-overlay');
    var textEl = document.getElementById('loading-overlay-text');
    if (overlay) {
      if (textEl) textEl.textContent = text || 'Memproses...';
      overlay.style.display = 'flex';
      overlay.classList.remove('hidden');
    }
  };

  /**
   * Hides the global blocking overlay.
   */
  SIKAP.Loading.hide = function() {
    var overlay = document.getElementById('global-loading-overlay');
    if (overlay) {
      overlay.style.display = 'none';
      overlay.classList.add('hidden');
    }
  };
</script>
