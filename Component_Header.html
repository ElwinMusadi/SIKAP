<!-- ============================================================ -->
<!-- Component_Header.html — Shared Header Bar                   -->
<!-- Faithfully reproduces the Stitch Dashboard Admin header      -->
<!-- ============================================================ -->

<header class="fixed top-0 left-0 right-0 h-14 bg-surface/95 backdrop-blur-md border-b border-outline-variant/40 z-[60] px-4 lg:px-container-margin flex items-center justify-between shadow-[0_2px_8px_rgba(11,28,48,0.04)]">
  <!-- Left: Logo + Title -->
  <div class="flex items-center gap-3">
    <!-- Mobile Hamburger -->
    <button class="lg:hidden p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors" onclick="SIKAP.UI.toggleSidebar()" aria-label="Toggle menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <!-- Logo -->
    <img alt="Logo Pemprov NTT" class="h-7 w-auto object-contain shrink-0 hidden sm:block" src="https://raw.githubusercontent.com/ElwinMusadi/app-assets/main/logo-ntt.png">
    <div class="flex flex-col justify-center min-w-0">
      <span class="font-label-md font-semibold text-primary leading-tight tracking-tight truncate">UPTD Pendapatan Daerah Wilayah Kota Kupang</span>
      <span class="font-body-sm text-on-surface-variant leading-tight mt-0.5 truncate hidden sm:block">Sistem Informasi Kepegawaian dan Arsip Pegawai</span>
    </div>
  </div>

  <!-- Right: Actions + Profile -->
  <div class="flex items-center gap-2 sm:gap-4">
    <button class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors hidden sm:block" aria-label="Pengaturan" onclick="SIKAP.Router.navigate('view-pengaturan')">
      <span class="material-symbols-outlined">settings</span>
    </button>
    <div class="h-6 w-px bg-outline-variant/60 hidden sm:block"></div>
    <!-- User Dropdown -->
    <div class="relative" id="header-profile-dropdown">
      <button class="w-8 h-8 rounded-full bg-primary hover:bg-primary-hover text-on-primary font-label-md flex items-center justify-center shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary/40 active:scale-95 cursor-pointer" onclick="SIKAP.UI.toggleProfileDropdown()" aria-label="Profil Pengguna" title="Menu Profil">
        <span class="user-initials font-bold text-[13px]">U</span>
      </button>
      <!-- Dropdown Menu -->
      <div id="profile-dropdown-menu" class="hidden absolute right-0 top-full mt-2 w-56 bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 overflow-hidden z-50">
        <div class="px-4 py-3 border-b border-outline-variant/20">
          <p class="font-label-md text-on-surface truncate" id="header-user-name">—</p>
          <p class="font-body-sm text-on-surface-variant" id="header-user-role-text">—</p>
        </div>
        <div class="py-1">
          <button class="w-full px-4 py-2.5 text-left font-body-md text-on-surface hover:bg-surface-container-high transition-colors flex items-center gap-3" onclick="SIKAP.Router.navigate('view-pengaturan'); SIKAP.UI.toggleProfileDropdown();">
            <span class="material-symbols-outlined text-[20px] text-on-surface-variant">settings</span>
            Pengaturan
          </button>
          <button class="w-full px-4 py-2.5 text-left font-body-md text-error hover:bg-error-container transition-colors flex items-center gap-3 cursor-pointer" onclick="SIKAP.UI.toggleProfileDropdown(); SIKAP.Auth.openLogoutModal();">
            <span class="material-symbols-outlined text-[20px]">logout</span>
            Keluar
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
  SIKAP.UI = SIKAP.UI || {};

  // Profile dropdown toggle
  SIKAP.UI.toggleProfileDropdown = function() {
    var menu = document.getElementById('profile-dropdown-menu');
    if (menu) menu.classList.toggle('hidden');
  };

  // Close dropdown when clicking outside
  document.addEventListener('click', function(e) {
    var dropdown = document.getElementById('header-profile-dropdown');
    var menu = document.getElementById('profile-dropdown-menu');
    if (dropdown && menu && !dropdown.contains(e.target)) {
      menu.classList.add('hidden');
    }
  });
</script>
